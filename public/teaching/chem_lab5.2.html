/* ===== 元素防线：化学塔防 ===== */
const D = window.__TD__;
const $ = (id) => document.getElementById(id);
const KEY = "chem-td-best-v1";
let best = 0;
try { best = JSON.parse(localStorage.getItem(KEY)) || 0; } catch(e){}

/* 地图：12 列 × 8 行，S 形路径 */
const COLS = 12, ROWS = 8;
const PATH = [];
for (let c = 0; c <= 9; c++) PATH.push([c, 1]);
for (let r = 2; r <= 4; r++) PATH.push([9, r]);
for (let c = 8; c >= 2; c--) PATH.push([c, 4]);
for (let r = 5; r <= 6; r++) PATH.push([2, r]);
for (let c = 3; c <= 11; c++) PATH.push([c, 6]);
const PATH_SET = new Set(PATH.map(p => p[0] + "," + p[1]));

/* 游戏状态 */
let gold, core, wave, running, speed, towers, foes, projs, floaters, selTower, over, won;

  gold = 120; core = 10; wave = 0; running = false; speed = 1;
  towers = []; foes = []; projs = []; floaters = []; selTower = null; over = false; won = false;
  renderPanel(); drawShop();
  $("tdStart").disabled = false;

  log("欢迎来到元素防线！点击空地建塔，反应克制可造成 2.5× 伤害。");
}
const foeProto = id => D.enemies.find(e => e.id === id);

function startWave(){
  if (running || over || won) return;
  if (wave >= D.waves.length) return;
  running = true;
  const comp = D.waves[wave];
  const hpMul = 1 + wave * 0.18;
  let t = 0;
  comp.forEach(([id, n]) => {
    const p = foeProto(id);
    for (let i = 0; i < n; i++){
      foes.push({id, cat: p.cat, color: p.color,
        hp: Math.round(p.hp * hpMul), maxhp: Math.round(p.hp * hpMul),
        spd: p.spd, gold: p.gold, seg: 0, prog: -t, r: p.cat === "boss" ? 0.42 : 0.26});
      t += 0.9;
    }
  });
  wave++;
  if (wave > best){ best = wave; localStorage.setItem(KEY, JSON.stringify(best)); }
  log(`第 <b>${wave}</b> 波入侵开始（${comp.map(c => c[0] + "×" + c[1]).join("、")}）`);
  $("tdStart").disabled = true;
  renderPanel();
}

/* 坐标换算（世界坐标=格子单位） */
function segPos(foe){
  let s = foe.prog;
  if (s < 0) return null;
  let i = Math.floor(s), f = s - i;
  if (i >= PATH.length - 1) return "end";
  const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1];
  return [x1 + (x2 - x1) * f + 0.5, y1 + (y2 - y1) * f + 0.5];
}

/* 建塔 */
const cv = $("tdCanvas"), ctx = cv.getContext("2d");
let tile = 48, ox = 0, oy = 0;
function fit(){
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== box.width * dpr){ cv.width = box.width * dpr; cv.height = box.height * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tile = Math.min(box.width / COLS, box.height / ROWS);
  ox = (box.width - tile * COLS) / 2; oy = (box.height - tile * ROWS) / 2;
}
cv.addEventListener("click", e => {
  if (over || won) return;
  const r = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - r.left - ox) / tile);
  const rr = Math.floor((e.clientY - r.top - oy) / tile);
  if (c < 0 || c >= COLS || rr < 0 || rr >= ROWS) return;
  if (PATH_SET.has(c + "," + rr)){ log("不能建在入侵路径上！"); return; }
  if (towers.find(t => t.c === c && t.r === rr)){ log("这里已经有塔了。"); return; }
  if (!selTower){ log("先在右侧选择要建造的反应塔。"); return; }
  if (gold < selTower.cost){ log("金币不足（需要 " + selTower.cost + "）。"); return; }
  gold -= selTower.cost;
  towers.push({c, r: rr, type: selTower, cd: 0});
  log(`建造 <b>${selTower.name}</b>（${selTower.reagent}），-${selTower.cost} 金币`);
  renderPanel();
});

/* 主循环 */
let lastT = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016) * speed;
  lastT = ts;
  fit();
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
function step(dt){
  if (over || won) return;
  // 敌人移动
  for (const f of foes){
    if (f.hp <= 0) continue;
    f.prog += f.spd * dt;
    const p = segPos(f);
    if (p === "end"){
      f.hp = 0; f.leaked = true;
      const dmg = f.cat === "boss" ? 3 : 1;
      core -= dmg;
      log(`<b>${f.id}</b> 闯入烧杯核心！核心 -${dmg}`);
      if (core <= 0){ core = 0; gameOver(); }
    }
  }
  // 塔攻击
  for (const t of towers){
    t.cd -= dt;
    if (t.cd > 0) continue;
    let tgt = null, tp = null, bestProg = -1;
    for (const f of foes){
      if (f.hp <= 0) continue;
      const p = segPos(f);
      if (!p || p === "end") continue;
      const d = Math.hypot(p[0] - (t.c + .5), p[1] - (t.r + .5));
      if (d <= t.type.range && f.prog > bestProg){ bestProg = f.prog; tgt = f; tp = p; }
    }
    if (tgt){
      t.cd = 1 / t.type.rate;
      const react = t.type.cats.includes(tgt.cat);
      const dmg = t.type.dmg * (react ? 2.5 : 1);
      tgt.hp -= dmg;
      projs.push({x1: t.c + .5, y1: t.r + .5, x2: tp[0], y2: tp[1], t: 1, color: t.type.color});
      if (react) floaters.push({x: tp[0], y: tp[1] - .4, txt: "反应!", t: 1, color: t.type.color});
      if (tgt.hp <= 0 && !tgt.counted){
        tgt.counted = true; gold += tgt.gold;
        const eq = react && t.type.eq[tgt.id] ? "：" + t.type.eq[tgt.id] : "";
        log(`${t.type.name} 消灭 <b>${tgt.id}</b>${eq}（+${tgt.gold} 金币）`);
      }
    }
  }
  foes = foes.filter(f => f.hp > 0 || (!f.leaked && f.prog < PATH.length && segPos(f) !== "end" && f.prog >= 0 && f.hp > 0));
  foes = foes.filter(f => f.hp > 0);
  // 波次结束判定
  if (running && foes.length === 0){
    running = false;
    const bonus = 20 + wave * 3;
    gold += bonus;
    log(`第 ${wave} 波防守成功！奖励 ${bonus} 金币。`);
    if (wave >= D.waves.length){ won = true; win(); }
    else { $("tdStart").disabled = false; $("tdStart").textContent = "▶ 开始第 " + (wave + 1) + " 波"; }
    renderPanel();
  }
  for (let i = projs.length - 1; i >= 0; i--){ projs[i].t -= dt * 4; if (projs[i].t <= 0) projs.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--){ floaters[i].t -= dt * 1.2; if (floaters[i].t <= 0) floaters.splice(i, 1); }
  renderPanelLite();
}
function gameOver(){
  over = true;
  log(`💥 核心被攻破！最终成绩：第 ${wave} 波。`);
  reportScore('td', wave);
  $("tdStart").disabled = true;
}
function win(){
  log("🏆 全部 15 波防守成功！粗盐巨怪已被制服，烧杯核心安然无恙！");
  reportScore('td', wave);
  $("tdStart").disabled = true;
}
/* 成绩上报（登录状态下自动上传排行榜，离线/未登录静默跳过） */
function reportScore(game, score){
  try {
    const t = localStorage.getItem('chem-token');
    if (!t) return;
    fetch('/api/forum', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'report', token: t, game, score})}).catch(() => {});
  } catch(e){}
}

/* 绘制 */
function draw(){
  const box = cv.parentElement.getBoundingClientRect();
  const cs = getComputedStyle(document.body);
  const ink = cs.getPropertyValue("--ink").trim() || "#333";
  const line = cs.getPropertyValue("--line").trim() || "#ccc";
  const acc = cs.getPropertyValue("--accent").trim() || "#c8102e";
  ctx.clearRect(0, 0, box.width, box.height);
  // 地块
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++){
    ctx.strokeStyle = line; ctx.globalAlpha = .35; ctx.lineWidth = 1;
    ctx.strokeRect(ox + c * tile, oy + r * tile, tile, tile);
  }
  ctx.globalAlpha = 1;
  // 路径
  ctx.fillStyle = "rgba(0,0,0,.08)";
  for (const [c, r] of PATH) ctx.fillRect(ox + c * tile, oy + r * tile, tile, tile);
  // 终点烧杯
  const [ec, er] = PATH[PATH.length - 1];
  ctx.font = `${tile * .6}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("⚗️", ox + (ec + .5) * tile, oy + (er + .5) * tile);
  // 塔
  for (const t of towers){
    const x = ox + (t.c + .5) * tile, y = oy + (t.r + .5) * tile;
    ctx.beginPath(); ctx.arc(x, y, tile * .34, 0, 7);
    ctx.fillStyle = t.type.color; ctx.fill();
    ctx.beginPath(); ctx.arc(x - tile * .1, y - tile * .1, tile * .1, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `bold ${tile * .26}px 'Noto Sans SC',sans-serif`;
    ctx.fillText(t.type.name[0], x, y + 1);
  }
  // 敌人
  for (const f of foes){
    const p = segPos(f); if (!p || p === "end") continue;
    const x = ox + p[0] * tile, y = oy + p[1] * tile;
    ctx.beginPath(); ctx.arc(x, y, tile * f.r, 0, 7);
    ctx.fillStyle = f.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = `${tile * (f.cat === "boss" ? .2 : .19)}px 'Noto Sans SC',sans-serif`;
    ctx.fillText(f.id, x, y);
    // 血条
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(x - tile * .3, y - tile * f.r - 7, tile * .6, 4);
    ctx.fillStyle = "#c8102e"; ctx.fillRect(x - tile * .3, y - tile * f.r - 7, tile * .6 * Math.max(0, f.hp / f.maxhp), 4);
  }
  // 弹道
  for (const p of projs){
    ctx.strokeStyle = p.color; ctx.globalAlpha = p.t; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ox + p.x1 * tile, oy + p.y1 * tile);
    ctx.lineTo(ox + p.x2 * tile, oy + p.y2 * tile); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 飘字
  for (const f of floaters){
    ctx.globalAlpha = Math.max(0, f.t);
    ctx.fillStyle = f.color; ctx.font = `bold ${tile * .24}px 'Noto Sans SC',sans-serif`;
    ctx.fillText(f.txt, ox + f.x * tile, oy + (f.y - (1 - f.t)) * tile);
  }
  ctx.globalAlpha = 1;
  // 选中塔的射程预览
  if (selTower){
    ctx.fillStyle = ink; ctx.globalAlpha = .55; ctx.font = `${tile * .3}px 'Noto Sans SC',sans-serif`;
    ctx.textAlign = "left";
    ctx.fillText(`已选：${selTower.name}（点击空地建造）`, ox + 6, oy + 16);
    ctx.globalAlpha = 1; ctx.textAlign = "center";
  }
  if (over || won){
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, box.width, box.height);
    ctx.fillStyle = "#fff"; ctx.font = "bold 26px 'Noto Sans SC',sans-serif";
    ctx.fillText(won ? "🏆 防守成功！" : "💥 核心被攻破", box.width / 2, box.height / 2 - 10);
    ctx.font = "15px 'Noto Sans SC',sans-serif";
    ctx.fillText(`成绩：第 ${wave} 波 · 历史最佳 第 ${best} 波`, box.width / 2, box.height / 2 + 24);
  }
}

/* 面板 */
function renderPanel(){
  $("tdCore").textContent = core + " / 10";
  $("tdCoreBar").style.width = (core / 10 * 100) + "%";
  renderPanelLite();
  $("tdBest").textContent = "第 " + best + " 波";
}
function renderPanelLite(){
  $("tdGold").textContent = gold;
  $("tdWave").textContent = wave + " / " + D.waves.length;
  $("tdFoes").textContent = foes.length;
}
function drawShop(){
  const box = $("tdShop"); box.innerHTML = "";
  D.towers.forEach(t => {
    const d = document.createElement("div");
    d.className = "td-tower";
    d.innerHTML = `<h4>${t.name} <i>${t.cost} 金</i></h4><p>${t.reagent} · 伤害 ${t.dmg} · 射程 ${t.range}<br>${t.desc}</p>`;
    d.onclick = () => {
      if (gold < t.cost){ log("金币不足，先防守几波攒金币。"); return; }
      selTower = t;
      [...box.children].forEach(x => x.classList.remove("sel"));
      d.classList.add("sel");
    };
    box.appendChild(d);
  });
}
function log(t){
  const el = $("tdLog");
  el.innerHTML = `<div>· ${t}</div>` + el.innerHTML;
  while (el.children.length > 12) el.lastChild.remove();
}

$("tdStart").onclick = startWave;
$("tdSpeed").onclick = () => { speed = speed === 1 ? 2 : 1; $("tdSpeed").textContent = "⏩ 速度 ×" + speed; };
$("tdReset").onclick = () => { if (confirm("重新开始本局？")) reset(); };

reset();
requestAnimationFrame(loop);
</script>
<script>/* ========= 主题切换 washi / sumi / ai ========= */
(function(){
  const root=document.documentElement, KEY='ch-theme-lab';
  const valid=['washi','sumi','ai'];
  const saved=localStorage.getItem(KEY);
  root.dataset.theme=valid.includes(saved)?saved:'washi';
  function sync(){ const t=root.dataset.theme; document.querySelectorAll('.ts-dot').forEach(b=>b.setAttribute('aria-current',b.dataset.setTheme===t?'true':'false')); }
  function set(t){ root.dataset.theme=t; localStorage.setItem(KEY,t); sync(); }
  document.querySelectorAll('.ts-dot').forEach(b=>b.addEventListener('click',()=>set(b.dataset.setTheme)));
  sync();
})();</script>
