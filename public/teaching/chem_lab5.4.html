<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化合星枢 · 化学合成图鉴</title>
<style>
:root{--bg:#f5f0e6;--panel:#efe8d9;--ink:#3a3632;--ink2:#7a736a;--line:#d8cfbc;--accent:#b03a2e;--accent-soft:#f0dcd8;--tile:#fbf8f1;--good:#3d7a4a;--danger:#c0392b;}
body[data-theme="shuzhu"]{--bg:#232120;--panel:#2c2a28;--ink:#ece5d8;--ink2:#9a9184;--line:#46423d;--accent:#d4573b;--accent-soft:#4a322b;--tile:#2c2a28;}
body[data-theme="lan"]{--bg:#1f2a44;--panel:#273355;--ink:#e8ecf4;--ink2:#8fa0c0;--line:#3a4a75;--accent:#7f9dc9;--accent-soft:#31405f;--tile:#273355;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable both-edges;}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;transition:background .3s,color .3s;}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);}
header h1{font-size:18px;font-weight:600;letter-spacing:2px;}
header h1 small{font-size:11px;color:var(--ink2);letter-spacing:1px;margin-left:8px;font-weight:400;}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums;}
#xpPill{width:172px;}
#dexPill{width:96px;}
.pill b{color:var(--accent);font-variant-numeric:tabular-nums;}
.spacer{flex:1;}
.tbtn{font-size:12px;padding:5px 12px;min-width:52px;text-align:center;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;font-family:inherit;transition:all .2s;}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.warn{border-color:var(--accent);color:var(--accent);}
main{padding:16px;max-width:960px;margin:0 auto;}
#hint{font-size:13px;color:var(--ink2);margin-bottom:12px;text-align:center;}
#hint b{color:var(--accent);}
#palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;}
.tile{position:relative;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px 6px 10px;text-align:center;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s,border-color .15s;}
.tile:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.12);}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.tile.can{border-color:var(--accent);}
.tile.can::after{content:"";position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.tile.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile .glyph{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:#fff;}
.tile .nm{font-size:13px;font-weight:500;line-height:1.25;}
.tile .dp{position:absolute;top:4px;right:6px;font-size:10px;color:var(--ink2);}
.tile.pop{animation:pop .5s;}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#dexbar{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-size:13px;color:var(--ink2);}
#dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
.dcell{border:1px dashed var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--ink2);cursor:pointer;}
.dcell.got{border-style:solid;color:var(--ink);}
.dcell .dg{font-size:16px;margin-bottom:2px;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
#overlay.hidden{display:none;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;padding:24px;animation:pop .35s;position:relative;max-height:85vh;overflow:auto;}
.card .tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--accent);color:#fff;margin-bottom:10px;}
.card .tag.new{background:var(--good);}
.card .tag.warn{background:var(--danger);}
.card h2{font-size:24px;font-weight:600;margin-bottom:4px;}
.card .eq{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:8px 10px;margin:12px 0;line-break:anywhere;}
.card .note{font-size:14px;line-height:1.7;}
.card .db{display:inline-block;margin-top:12px;font-size:12px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);}
.card .db::before{content:"📖 成分库 · ";}
.card .warnbox{margin-top:12px;font-size:13px;color:#fff;background:var(--danger);border-radius:8px;padding:10px 12px;line-height:1.6;}
.card .x{position:absolute;top:12px;right:14px;font-size:20px;color:var(--ink2);cursor:pointer;background:none;border:none;font-family:inherit;}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;}
#toast.show{opacity:.92;}
@media (max-width:600px){header h1{font-size:15px}#palette{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}.tile .glyph{width:32px;height:32px;font-size:16px}}
#tut,#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px;}
#tut.hidden,#dlg.hidden{display:none;}
.vwrap{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:176px;flex:0 0 auto;}
.vbtn{border:none;border-radius:0;padding:5px 4px;width:86px;min-width:86px;}
.tile .fmain{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;min-height:22px;letter-spacing:.5px;}
.tile .fnm{font-size:11px;color:var(--ink2);margin-top:2px;}
.tile .fcm{display:block;font-size:9px;color:var(--accent);margin-top:1px;}
.tile .fcat{display:inline-block;font-size:9px;color:#fff;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px;}
</style>
<style>html,body{overscroll-behavior:none;}</style>
</head>

let DATA, ITEMS, PAIR, SAVE_KEY, version;
function loadVersion(v){
  version = v;
  DATA = (v === "full") ? DATA_FULL : DATA_LIFE;
  ITEMS = {}; DATA.items.forEach(i => ITEMS[i.name] = i);
  PAIR = {}; DATA.recipes.forEach(r => { const k = [r.a, r.b].sort().join("|"); PAIR[k] = r; });
  SAVE_KEY = "wuzhi_sandbox_v2_" + v;
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  state = (saved && Array.isArray(saved.discovered)) ? saved : { discovered: [...DATA.meta.starters], xp: 0 };
  state.discovered = state.discovered.filter(n => ITEMS[n]);   // 过滤已删除的物质，兼容旧存档
  localStorage.setItem("wuzhi_version", v);
}

const CAT_COLORS = {"单质":"#8e7cc3","氧化物":"#e69138","酸":"#cc0000","碱":"#3c78d8","盐":"#6aa84f","有机物":"#674ea7","混合物":"#888888","其他":"#b03a2e"};
const DEPTH_COLORS = ["#8f9aa8","#5b8fd6","#4aa876","#d6904a","#c9663f","#a04ac2","#c23a6e","#3aa6a6","#b03a2e"];
const GLYPH = {"水":"💧","空气":"🌬","火":"🔥","岩石":"⛰","食盐":"🧂","矿砂":"⛏","氮气":"🎈","氢气":"🫧","氨":"🌫","硫酸":"🧪","硝酸":"🧪","铜":"🔶","甲烷":"🏭","氯气":"🟡","氨水":"🌫","尿素":"🌾"};
function glyph(name){
  if (GLYPH[name]) return GLYPH[name];
  const it = ITEMS[name];
  if (it && it.db) return it.db.slice(0,1);
  return name.slice(0,1);
}
function depthColor(d){ return DEPTH_COLORS[Math.min(d, DEPTH_COLORS.length-1)]; }

let state = { discovered: [], xp: 0 };
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

let sel = null;
const $ = id => document.getElementById(id);

function render(){
  $("xp").textContent = state.xp;
  $("lv").textContent = Math.floor(state.xp/100) + 1;
  $("cnt").textContent = state.discovered.length;
  $("tot").textContent = DATA.items.length;
  const pal = $("palette"); pal.innerHTML = "";
  const sorted = [...state.discovered].sort((a,b) => (ITEMS[a].depth - ITEMS[b].depth) || a.localeCompare(b,"zh"));
  sorted.forEach(name => {
    const it = ITEMS[name];
    if (!it) return;
    const t = document.createElement("div");
    t.className = "tile" + (sel === name ? " sel" : "") + (easyMode && sel && sel !== name && PAIR[[sel, name].sort().join("|")] ? " can" : "");
    t.dataset.name = name;
    if (version === "full") {
      const cat = it.category || "其他";
      const main = (it.formula && it.formula !== "—") ? it.formula : name;
      t.innerHTML = `<div class="fmain">${main}</div><div class="fnm">${name}</div><div class="fcl"><span class="fcat" style="background:${CAT_COLORS[cat]||"#999"}">${cat}</span></div>${it.common ? `<div class="fcm">${it.common}</div>` : ""}<div class="dp">Lv${it.depth}</div>`;
    } else {
      t.innerHTML = `<div class="glyph" style="background:${depthColor(it.depth)}">${glyph(name)}</div><div class="nm">${name}</div><div class="dp">Lv${it.depth}</div>`;
    }
    t.onclick = () => pick(name, t);
    t.ondragstart = ev => { ev.dataTransfer.setData("text/plain", name); sel = name; };
    t.draggable = true;
    t.ondragover = ev => ev.preventDefault();
    t.ondrop = ev => { ev.preventDefault(); const a = ev.dataTransfer.getData("text/plain"); if (a && a !== name) merge(a, name); };
    pal.appendChild(t);
  });
  const dg = $("dexgrid"); dg.innerHTML = "";
  DATA.items.forEach(it => {
    const got = state.discovered.includes(it.name);
    const c = document.createElement("div");
    c.className = "dcell" + (got ? " got" : "");
    const ftop = (got && it.formula && it.formula !== "—") ? it.formula : (got ? glyph(it.name) : "？");
    c.innerHTML = `<div class="dg" style="font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:600;">${ftop}</div>${got ? it.name : "？？？"}`;
    if (!got) c.onclick = () => toast(`「？？？」需合成至第 ${it.depth} 层解锁`);
    dg.appendChild(c);
  });
}

function pick(name, el){
  if (!sel) { sel = name; render(); return; }
  if (sel === name) { sel = null; render(); return; }
  const a = sel; sel = null; merge(a, name);
}

function merge(a, b){
  const k = [a,b].sort().join("|");
  const r = PAIR[k];
  if (!r) { fail(a,b); return; }
  const isNew = !state.discovered.includes(r.result);
  if (isNew) {
    state.discovered.push(r.result);
    state.xp += 10 * (ITEMS[r.result].depth || 1);
  } else { state.xp += 2; }
  save(); render();
  const tile = document.querySelector(`.tile[data-name="${r.result}"]`);
  if (tile) tile.classList.add("pop");
  showCard(r, isNew);
}

function fail(a,b){
  [a,b].forEach(n => { const t = document.querySelector(`.tile[data-name="${n}"]`); if (t){ t.classList.add("shake"); setTimeout(()=>t.classList.remove("shake"),450); }});
  toast(`${a} + ${b}：没有反应`);
}

function showCard(r, isNew){
  const it = ITEMS[r.result] || {};
  const danger = !!r.danger;
  const tag = danger ? `<span class="tag warn">危险反应</span>` : isNew ? `<span class="tag new">新发现 +${10*(it.depth||1)} XP</span>` : `<span class="tag">已知物质 +2 XP</span>`;
  $("card").innerHTML = `
    <button class="x" onclick="hideCard()">×</button>
    ${tag}
    <h2>${r.result}</h2>
    ${version === "full" && it.formula ? `<div style="font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:15px;color:var(--ink2);margin-top:4px">${it.formula}${it.category ? " · " + it.category : ""}${it.common ? " · 俗称 " + it.common : ""}</div>` : ""}
    ${r.eq && r.eq !== "—" ? `<div class="eq">${r.eq}</div>` : ""}
    <p class="note">${r.note}</p>
    ${r.db ? `<span class="db">${r.db}</span>` : ""}
    ${danger ? `<div class="warnbox">⚠️ ${DATA.danger_combos.find(d => d.a === r.a && d.b === r.b)?.warn || "该组合产生有毒气体，现实中严禁混合！"}</div>` : ""}
  `;
  $("overlay").classList.remove("hidden");
}
function hideCard(){ $("overlay").classList.add("hidden"); }
$("overlay").onclick = e => { if (e.target === $("overlay")) hideCard(); };

let toastTimer = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

document.querySelectorAll(".tbtn[data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tbtn[data-t]").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  document.body.dataset.theme = b.dataset.t;
});
$("hintBtn").onclick = () => {
  const pool = DATA.recipes.filter(r => state.discovered.includes(r.a) && state.discovered.includes(r.b) && !state.discovered.includes(r.result));
  if (!pool.length) { toast("当前物质已全部合成，去点亮更深的图鉴吧"); return; }
  const r = pool[Math.floor(Math.random() * pool.length)];
  toast(`💡 试试：${r.a} + ${r.b}，会合成什么呢？`);
};
$("reset").onclick = () => { if (confirm("重置所有合成进度？")) { state = { discovered:[...DATA.meta.starters], xp:0 }; save(); render(); toast("已重置，从四源开始吧"); } };

// ===== 低难度模式 =====
let easyMode = false;
$("easyBtn").onclick = () => {
  easyMode = !easyMode;
  $("easyBtn").classList.toggle("on", easyMode);
  if (easyMode) showDlg("🎈 低难度模式已开启", "现在你点选物质时，会显示能与其反应的其他物质（红点标记）。再次点击「🎈 低难度」即可退出。");
  else toast("已退出低难度模式");
  render();
};
function showDlg(title, msg){
  $("dlg").innerHTML = `<div class="card" style="max-width:340px"><h2 style="font-size:18px">${title}</h2><p class="note" style="margin-top:10px">${msg}</p><div style="margin-top:16px;text-align:right"><button class="tbtn on" onclick="hideDlg()">知道了</button></div></div>`;
  $("dlg").classList.remove("hidden");
}
function hideDlg(){ $("dlg").classList.add("hidden"); }
$("dlg").onclick = e => { if (e.target === $("dlg")) hideDlg(); };

// ===== 新手引导 =====
const TUT = [
  {t:"🧪 欢迎来到化合星枢", m:"从 水 · 空气 · 火 · 岩石 四种物质出发，通过两两合成，点亮全部 67 种物质的图鉴。"},
  {t:"👆 点选合成", m:"点击一种物质，再点击另一种，就能尝试合成。成功会弹出「生活档案卡」——化学方程式 + 生活注释；没反应会抖动提示。"},
  {t:"📖 生活档案卡", m:"卡片上带「📖 成分库」标签的物质，正式版将直接跳转站内 417 条成分检索库的对应条目——游戏即数据库入口。"},
  {t:"⚠️ 危险反应", m:"有些组合现实中会产生毒气（如 84消毒液 + 洁厕灵 → 氯气），游戏会弹出红色警示。这些全是真实的安全知识。"},
  {t:"🎛️ 功能一览", m:"💡提示：随机给一条合成线索｜🎈低难度：点选时标出可反应物质｜和紙·墨朱·藍：一键换肤｜📓化学手记 XP 记录成长｜⚗️对照实验：「🧂柴米油盐」与「🌌万物全图」一键切换。开始合成吧！"}
];
let tutStep = -1;
function showTut(i){
  tutStep = i;
  if (i < 0 || i >= TUT.length) { $("tut").classList.add("hidden"); localStorage.setItem("wuzhi_tut_done","1"); return; }
  const dots = TUT.map((_,k)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;background:${k===i?"var(--accent)":"var(--line)"}"></span>`).join("");
  $("tut").innerHTML = `<div class="card" style="max-width:380px">
    <h2 style="font-size:19px">${TUT[i].t}</h2>
    <p class="note" style="margin:12px 0 4px">${TUT[i].m}</p>
    <div style="text-align:center;margin:10px 0 2px">${dots}</div>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="tbtn" onclick="skipTut()">跳过指引</button>
      <button class="tbtn on" onclick="showTut(tutStep+1)">${i===TUT.length-1?"开始合成 🚀":"下一步"}</button>
    </div></div>`;
  $("tut").classList.remove("hidden");
}
function skipTut(){ tutStep = -1; $("tut").classList.add("hidden"); localStorage.setItem("wuzhi_tut_done","1"); toast("已跳过指引，随时可点右上角「?」重新查看"); }
$("tutBtn").onclick = () => showTut(0);
if (!localStorage.getItem("wuzhi_tut_done")) showTut(0);

document.querySelectorAll(".vbtn").forEach(b => b.onclick = () => {
  if (b.dataset.v === version) return;
  document.querySelectorAll(".vbtn").forEach(x => x.classList.toggle("on", x === b));
  loadVersion(b.dataset.v);
  sel = null; easyMode = false; $("easyBtn").classList.remove("on");
  render();
  toast(version === "full" ? "🌌 万物全图：110 种物质 · 183 条配方，硫/氮/铜/氢工业全链开启" : "🧂 柴米油盐：67 种生活物质");
});
loadVersion(localStorage.getItem("wuzhi_version") || "life");
document.querySelectorAll(".vbtn").forEach(b => b.classList.toggle("on", b.dataset.v === version));
document.addEventListener("keydown", e => { if (e.key === "Escape") { hideCard(); hideDlg(); } });
render();
</script>
