/* ---------- 结构搭建工具栏 ---------- */
var uid=0;
function BuilderTools(props){
  var S=props.S, app=props.app;
  function addNode(el){
    var g=JSON.parse(JSON.stringify(S.bgraph));
    var id='u'+(++uid);
    g.nodes.push({id:id,el:el});
    var sel=S.sel, linked=false;
    if(sel.length===1){ g.edges.push({a:sel[0],b:id,order:1}); sel=[id]; linked=true; }
    else sel=[id];
    props.patch({bgraph:g,sel:sel});
    if(window.SFX){ SFX.pop(); if(linked) SFX.bond(); }
  }
  function addBenzene(){
    var g=JSON.parse(JSON.stringify(S.bgraph));
    var anchor=(S.sel&&S.sel.length===1)?S.sel[0]:null;
    if(!anchor&&S.lastA&&S.bgraph.nodes.some(function(n){return n.id===S.lastA;})) anchor=S.lastA;
    if(!anchor&&S.bgraph.nodes.length) anchor=S.bgraph.nodes[S.bgraph.nodes.length-1].id;
    var ids=[];
    for(var i=0;i<6;i++){
      var id='u'+(++uid);
      var ang=Math.PI/3*i-Math.PI/6;
      var bc=Math.floor(S.bgraph.nodes.filter(function(n){return n.arom;}).length/6);
      g.nodes.push({id:id,el:'C',arom:true,x:anchor?null:(370+bc*320+105*Math.cos(ang)),y:anchor?null:105*Math.sin(ang)});
      ids.push(id);
    }
    for(i=0;i<6;i++) g.edges.push({a:ids[i],b:ids[(i+1)%6],order:1});
    if(anchor){ g.edges.push({a:anchor,b:ids[0],order:1}); }
    props.patch({bgraph:g,sel:[]});
    if(window.SFX){ SFX.pop(); if(anchor) SFX.bond(); }
  }
  function bondSel(order){
    if(S.sel.length!==2) return;
    var a=S.sel[0],b=S.sel[1];
    var exists=S.bgraph.edges.some(function(e){ return (e.a===a&&e.b===b)||(e.a===b&&e.b===a); });
    if(exists) return;
    var g=JSON.parse(JSON.stringify(S.bgraph));
    g.edges.push({a:a,b:b,order:order});
    props.patch({bgraph:g});
    if(window.SFX) SFX.bond();
  }
  function delSel(){
    if(!S.sel.length) return;
    var rm={}; S.sel.forEach(function(id){ rm[id]=1; });
    var g=JSON.parse(JSON.stringify(S.bgraph));
    g.nodes=g.nodes.filter(function(n){ return !rm[n.id]; });
    g.edges=g.edges.filter(function(e){ return !rm[e.a]&&!rm[e.b]; });
    props.patch({bgraph:g,sel:[]});
    if(window.SFX) SFX.tick();
  }
  var T=app.tools;
  var ELS=[['C','碳','#00b8e0'],['O','氧','#ff8a00'],['N','氮','#3f6fe0'],['S','硫','#d9c53a'],['H','氢','#c9d4ee'],['F','氟','#2fd98a'],['Cl','氯','#5ad144'],['Br','溴','#c47a3a'],['I','碘','#8a4de0']];
  return h('div',{className:'card',style:{padding:12}},
    h('div',{className:'klabel'},'元 素 · 第一个原子点画布空白，之后点已有原子向外生长'),
    h('div',{className:'row',style:{marginBottom:10}},
      ELS.map(function(ed){
        return h('button',{key:ed[0],className:'elbtn'+(S.curEl===ed[0]?' on':''),onClick:function(){ props.patch({curEl:ed[0]}); }},
          h('i',{style:{background:ed[2]}}),ed[1]);
      })),
    h('div',{className:'row',style:{marginBottom:10}},
      [['1','单键'],['2','双键'],['3','三键']].map(function(od){
        return h('button',{key:od[0],className:'elbtn'+(String(S.curOrd||1)===od[0]?' on':''),onClick:function(){ props.patch({curOrd:parseInt(od[0],10)}); }},od[1]);
      })),
    h('div',{className:'row'},
      T.indexOf('R')>=0?h('button',{className:'hbtn sm',onClick:addBenzene},'＋ 苯环'):null,
      h('button',{className:'hbtn sm',onClick:function(){ bondSel(1); }},'单键连接'),
      h('button',{className:'hbtn sm',onClick:function(){ bondSel(2); }},'双键连接'),
      h('button',{className:'hbtn sm'+(S.pick?' primary':''),onClick:function(){ props.patch({pick:!S.pick,sel:[]}); }},'☝ 选择模式'),
      h('button',{className:'hbtn sm bad',onClick:delSel},'删除选中'),
      h('button',{className:'hbtn sm ghost',onClick:function(){ if(props.onUndo) props.onUndo(); }},'↩ 回退')),
    h('div',{className:'muted',style:{marginTop:8,fontSize:12}},
      S.pick?'选择模式：点选 1~2 个原子，再使用单键 / 双键 / 删除。':'生长模式：只有第一个原子能点画布空白放置；之后点已有原子按所选「单/双/三键」生长。价位上限：C4 · N3 · O2 · S2 · H/卤素1，超价拒绝（红闪+低音）。'));
}

/* ---------- 闯关游戏 ---------- */
function GameApp(props){
  var app=props.app;
  var st=React.useState({phase:'menu',mode:null,qs:[],idx:0,score:0,res:[],tiles:[],bgraph:{nodes:[],edges:[]},sel:[],fb:null,curEl:'C',curOrd:1,pick:false,past:[],lastA:null});
  var S=st[0];
  function patch(o){ st[1](function(prev){
    var skip=o.skipHist;
    var n=Object.assign({},prev,o);
    if(skip) delete n.skipHist;
    if(o.bgraph&&prev.bgraph&&!skip) n.past=(prev.past||[]).concat([prev.bgraph]).slice(-30);
    return n;
  }); }
  function undo(){
    if(!S.past||!S.past.length){ if(window.SFX) SFX.tick(); return; }
    var past=S.past.slice();
    var last=past.pop();
    patch({bgraph:last,past:past,sel:[],skipHist:true});
    if(window.SFX) SFX.tick();
  }

  function start(mode){
    var pool=window.POOLS[app.id];
    var list;
    if(mode==='hell') list=NL.pick(pool.hell,6);
    else list=NL.shuffle(NL.pick(pool.beginner,3).concat(NL.pick(pool.intermediate,4),NL.pick(pool.advanced,3)));
    var qs=list.map(function(q){
      var g=NL.buildGraph(q.kind,q.spec);
      return {t:q.t,kind:q.kind,hint:q.hint,wrong:q.wrong,graph:g,target:NL.nameMolecule(g)};
    });
    patch({phase:'play',mode:mode,qs:qs,idx:0,score:0,res:[],tiles:[],bgraph:{nodes:[],edges:[]},sel:[],fb:null,past:[],skipHist:true});
  }
  function save(){
    var d=window.STORE.load();
    var rec=d[app.id]||(d[app.id]={});
    var m=S.mode==='hell'?'hell':'std';
    rec[m+'Plays']=(rec[m+'Plays']||0)+1;
    rec[m+'Best']=Math.max(rec[m+'Best']||0,S.score);
    window.STORE.save(d);
  }
  function check(){
    var q=S.qs[S.idx];
    var ok,msg;
    if(q.t==='build'){
      var derived=NL.nameMolecule(S.bgraph);
      ok=!!derived&&NL.norm(derived)===NL.norm(q.target);
      msg= ok
        ? '你搭的结构正是 「'+q.target+'」，图同构校验通过！'
        : (derived
            ? '你搭的结构会被命名为 「'+derived+'」，题目要求 「'+q.target+'」。对照差异再改改。'
            : '结构还没有连成一体：碳骨架必须连通，氧要用双键表达羰基。');
    }else{
      var ans=S.tiles.join('');
      ok=NL.norm(ans)===NL.norm(q.target);
      msg= ok
        ? (q.t==='judge'?'纠错成功！正确名称是 「'+q.target+'」。':'命名正确：「'+q.target+'」。')
        : '你拼的是 「'+(ans||'（空）')+'」。正确答案是 「'+q.target+'」。回想一下：最长链怎么选、从哪头编号、取代基按什么顺序写。';
    }
    if(window.SFX){
      if(ok) SFX.good();
      else { SFX.bad(); document.body.classList.add('dmg'); setTimeout(function(){ document.body.classList.remove('dmg'); },520); }
    }
    var res=S.res.slice(); res[S.idx]=ok;
    patch({fb:{open:true,ok:ok,msg:msg},res:res,score:ok?S.score+1:S.score});
  }
  function next(){
    if(S.idx+1>=S.qs.length){ save(); patch({phase:'result',fb:null}); return; }
    patch({idx:S.idx+1,fb:null,tiles:[],bgraph:{nodes:[],edges:[]},sel:[],skipHist:true});
  }
  function skip(){
    var res=S.res.slice(); res[S.idx]=false;
    var o={res:res,fb:null,tiles:[],bgraph:{nodes:[],edges:[]},sel:[],skipHist:true};
    if(S.idx+1>=S.qs.length){ save(); o.phase='result'; }
    else o.idx=S.idx+1;
    patch(o);
  }
  var VALC={C:4,N:3,O:2,S:2,H:1,F:1,Cl:1,Br:1,I:1};
  function valUsed(g,id){ var t=0; g.edges.forEach(function(e){ if(e.a===id||e.b===id) t+=e.order; }); return t; }
  function refuse(){ if(window.SFX) SFX.bad(); document.body.classList.add('dmg'); setTimeout(function(){ document.body.classList.remove('dmg'); },420); }
  function spawnAt(el,anchor,x,y){
    var g=JSON.parse(JSON.stringify(S.bgraph));
    var ord=S.curOrd||1;
    if(anchor){
      var ae=(g.nodes.filter(function(n){return n.id===anchor;})[0]||{}).el||'C';
      if(valUsed(g,anchor)+ord>(VALC[ae]||4) || ord>(VALC[el]||4)){ refuse(); return; }
    }
    var id='u'+(++uid);
    var node={id:id,el:el};
    if(x!=null){ node.x=x; node.y=y; }
    g.nodes.push(node);
    var anchored=false;
    if(anchor){ g.edges.push({a:anchor,b:id,order:ord}); anchored=true; }
    patch({bgraph:g,sel:[id]});
    if(window.SFX){ SFX.pop(); if(anchored) SFX.bond(); }
  }
  function onNodeClick(id){
    if(!S.pick){ patch({lastA:id}); spawnAt(S.curEl||'C',id); return; }
    var s=S.sel.slice();
    var i=s.indexOf(id);
    if(i>=0) s.splice(i,1);
    else { s.push(id); if(s.length>2) s.shift(); }
    patch({sel:s});
  }
  function onCanvasClick(x,y){
    if(S.pick) return;
    if(S.bgraph.nodes.length){ if(window.SFX) SFX.tick(); return; }
    spawnAt(S.curEl||'C',null,x,y);
  }

  /* ----- 菜单 ----- */
  if(S.phase==='menu'){
    var d=window.STORE.load(), rec=d[app.id]||{};
    return h('div',null,
      h('h1',null,app.name),
      h('div',{className:'sub'},app.desc),
      h('div',{className:'modes'},
        h('button',{className:'card mode',onClick:function(){ start('std'); }},
          h('div',{className:'mt'},h('span',{className:'atom-ic'},h('i',{className:'r1'}),h('i',{className:'r2'}),h('b')),'标准闯关'),
          h('div',{className:'md'},'初、中、高三个难度共 10 题。答错不惩罚，随时跳过，进度本地保存。'),
          h('div',{className:'statline'},'已完成 '+(rec.stdPlays||0)+' 次 · 最佳 '+(rec.stdBest||0)+'/10')),
        h('button',{className:'card mode',onClick:function(){ start('hell'); }},
          h('div',{className:'mt'},h('span',{className:'atom-ic mag'},h('i',{className:'r1'}),h('i',{className:'r2'}),h('b')),'地狱挑战'),
          h('div',{className:'md'},'6 道陷阱题：编号方向、书写顺序、最长链拐弯……专治各种"我觉得对了"。'),
          h('div',{className:'statline'},'已完成 '+(rec.hellPlays||0)+' 次 · 最佳 '+(rec.hellBest||0)+'/6'))),
      h('div',{className:'statline'},'本模块不强制答题、不用登录，关掉页面进度也在。'));
  }

  /* ----- 结算 ----- */
  if(S.phase==='result'){
    var total=S.qs.length, ratio=S.score/total;
    var word=ratio>=1?'完美！命名大师就是你':ratio>=0.8?'非常棒，陷阱都拦不住你':ratio>=0.6?'不错，再刷一遍冲满分':'别灰心，地狱模式本来就是硬骨头';
    return h('div',null,
      h('div',{className:'card center'},
        h('h2',null,app.name+' · '+(S.mode==='hell'?'地狱挑战':'标准闯关')),
        h('div',{className:'bigscore'},S.score+' / '+total),
        h('div',{className:'muted'},word),
        h('div',{className:'row',style:{justifyContent:'center',marginTop:16}},
          h('button',{className:'hbtn primary',onClick:function(){ start(S.mode); }},'再来一局'),
          h('button',{className:'hbtn',onClick:function(){ patch({phase:'menu'}); }},'返回菜单'))));
  }

  /* ----- 答题 ----- */
  var q=S.qs[S.idx];
  var TYPE_TXT={build:'搭建结构',name:'拼出名称',judge:'纠错命名'};
  return h('div',null,
    h('div',{className:'dots'},S.qs.map(function(_,i){
      return h('span',{key:i,className:'dot'+(i===S.idx?' cur':(S.res[i]===true?' ok':(S.res[i]===false?' no':'')))});
    })),
    h('div',{className:'qcard'},
      h('div',{className:'muted',style:{fontSize:12,marginBottom:6}},'第 '+(S.idx+1)+' / '+S.qs.length+' 题 · '+TYPE_TXT[q.t]+' · 得分 '+S.score),
      q.t==='build'
        ? h('div',{className:'qname'},'请搭建：'+q.target)
        : (q.t==='name'
            ? h('div',null,h('div',{style:{fontSize:15,fontWeight:700}},'看结构，拼出它的系统命名：'))
            : h('div',null,
                h('div',{style:{fontSize:15,fontWeight:700}},'某同学把它叫作：'),
                h('div',{className:'qwrong'},q.wrong),
                h('div',{style:{fontSize:14,marginTop:6}},'这个名字有问题，请拼出正确名称：'))),
      q.hint?h('div',{className:'hint'},'💡 '+q.hint):null),
    q.t==='build'
      ? h('div',null,
          h(MoleculeView,{graph:S.bgraph,sel:S.sel,onNodeClick:onNodeClick,onCanvasClick:onCanvasClick,rippleSel:S.pick,resetKey:'b'+S.idx}),
          h('div',{style:{height:10}}),
          h(BuilderTools,{S:S,app:app,patch:patch,onUndo:undo}))
      : h('div',null,
          h(MoleculeView,{graph:q.graph,resetKey:'v'+S.idx}),
          h('div',{style:{height:10}}),
          h(TileKeyboard,{groups:window.keyGroups(app.family),tiles:S.tiles,
            onAdd:function(t){ patch({tiles:S.tiles.concat([t])}); },
            onDel:function(i){ var t=S.tiles.slice(); t.splice(i,1); patch({tiles:t}); },
            onClear:function(){ patch({tiles:[]}); }})),
    h('div',{className:'row',style:{marginTop:14}},
      h('button',{className:'hbtn primary',onClick:check},'✓ 检查答案'),
      q.t==='build'
        ? h('button',{className:'hbtn',onClick:function(){ patch({bgraph:{nodes:[],edges:[]},sel:[]}); }},'清空重搭')
        : h('button',{className:'hbtn',onClick:function(){ patch({tiles:[]}); }},'清空'),
      h('button',{className:'hbtn ghost',onClick:skip},'跳过 ➜')),
    h(Feedback,{open:S.fb&&S.fb.open,ok:S.fb&&S.fb.ok,msg:S.fb?S.fb.msg:'',
      onClose:function(){ patch({fb:null}); },
      onSkip:skip,onNext:next}));
}

/* ---------- 命名生成器 ---------- */
function GeneratorApp(props){
  var app=props.app;
  var st=React.useState({graph:{nodes:[],edges:[]},sel:[],resetKey:0,copied:false,curEl:'C',curOrd:1,pick:false,past:[],lastA:null});
  var S=st[0];
  function patch(o){ st[1](function(prev){
    var skip=o.skipHist;
    var n=Object.assign({},prev,o);
    if(skip) delete n.skipHist;
    if(o.graph&&prev.graph&&!skip) n.past=(prev.past||[]).concat([prev.graph]).slice(-30);
    return n;
  }); }
  function undo(){
    if(!S.past||!S.past.length){ if(window.SFX) SFX.tick(); return; }
    var past=S.past.slice();
    var last=past.pop();
    patch({graph:last,past:past,sel:[],skipHist:true});
    if(window.SFX) SFX.tick();
  }
  var name=NL.nameMolecule(S.graph);
  var VALC={C:4,N:3,O:2,S:2,H:1,F:1,Cl:1,Br:1,I:1};
  function valUsed(g,id){ var t=0; g.edges.forEach(function(e){ if(e.a===id||e.b===id) t+=e.order; }); return t; }
  function refuse(){ if(window.SFX) SFX.bad(); document.body.classList.add('dmg'); setTimeout(function(){ document.body.classList.remove('dmg'); },420); }
  function spawnAt(el,anchor,x,y){
    var g=JSON.parse(JSON.stringify(S.graph));
    var ord=S.curOrd||1;
    if(anchor){
      var ae=(g.nodes.filter(function(n){return n.id===anchor;})[0]||{}).el||'C';
      if(valUsed(g,anchor)+ord>(VALC[ae]||4) || ord>(VALC[el]||4)){ refuse(); return; }
    }
    var id='u'+(++uid);
    var node={id:id,el:el};
    if(x!=null){ node.x=x; node.y=y; }
    g.nodes.push(node);
    var anchored=false;
    if(anchor){ g.edges.push({a:anchor,b:id,order:ord}); anchored=true; }
    patch({graph:g,sel:[id]});
    if(window.SFX){ SFX.pop(); if(anchored) SFX.bond(); }
  }
  function onNodeClick(id){
    if(!S.pick){ patch({lastA:id}); spawnAt(S.curEl||'C',id); return; }
    var s=S.sel.slice();
    var i=s.indexOf(id);
    if(i>=0) s.splice(i,1);
    else { s.push(id); if(s.length>2) s.shift(); }
    patch({sel:s});
  }
  function onCanvasClick(x,y){
    if(S.pick) return;
    if(S.graph.nodes.length){ if(window.SFX) SFX.tick(); return; }
    spawnAt(S.curEl||'C',null,x,y);
  }
  function randomSample(){
    var fams=['alkane','alkene','oxygen','ester','aromatic'];
    var fam=fams[Math.floor(Math.random()*fams.length)];
    var pool=window.POOLS[fam];
    var lvl=['beginner','intermediate','advanced'][Math.floor(Math.random()*3)];
    var arr=pool[lvl];
    var q=arr[Math.floor(Math.random()*arr.length)];
    patch({graph:NL.buildGraph(q.kind,q.spec),sel:[],resetKey:S.resetKey+1,copied:false});
  }
  function copyName(){
    if(!name) return;
    function done(){ patch({copied:true}); setTimeout(function(){ patch({copied:false}); },1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(name).then(done,function(){ fallback(); });
    }else fallback();
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=name; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }
  return h('div',null,
    h('h1',null,'命名生成器'),
    h('div',{className:'sub'},'自由搭建分子结构，命名引擎实时推导中文系统名。搭错了也会告诉你它"其实是什么"。'),
    h(MoleculeView,{graph:S.graph,sel:S.sel,onNodeClick:onNodeClick,onCanvasClick:onCanvasClick,rippleSel:S.pick,resetKey:'g'+S.resetKey,hintText:'点空白放原子 · 点原子生长 · 试试搭烷/烯/醇/醛/酮/酸/酯'}),
    h('div',{style:{height:10}}),
    h(BuilderTools,{S:{bgraph:S.graph,sel:S.sel,curEl:S.curEl,curOrd:S.curOrd,pick:S.pick,lastA:S.lastA},app:app,patch:function(o){
      var n={};
      if(o.bgraph) n.graph=o.bgraph;
      if(o.sel) n.sel=o.sel;
      if(o.curEl) n.curEl=o.curEl;
      if(o.curOrd) n.curOrd=o.curOrd;
      if(o.pick!=null) n.pick=o.pick;
      patch(n);
    },onUndo:undo}),
    h('div',{className:'qcard',style:{marginTop:14}},
      h('div',{className:'muted',style:{fontSize:12,marginBottom:6}},'结构名称'),
      h('div',{className:'qname',style:{fontSize:22}},name?name:'—— 无法命名：请搭一个连通的完整结构 ——'),
      h('div',{className:'row',style:{marginTop:12}},
        h('button',{className:'hbtn primary',onClick:copyName,disabled:!name},S.copied?'✓ 已复制':'复制名称'),
        h('button',{className:'hbtn',onClick:randomSample},'随机来一题'),
        h('button',{className:'hbtn ghost',onClick:function(){ patch({graph:{nodes:[],edges:[]},sel:[],resetKey:S.resetKey+1}); }},'清空'))));
}

/* ---------- 外壳: 品牌 + 三色调 + Tab 路由 ---------- */
var APPS=[
 {id:'alkane',name:'烷烃命名',family:'alkane',desc:'最长碳链 · 最低位次组 · 取代基按字母序书写',tools:'C'},
 {id:'alkene',name:'烯烃命名',family:'alkene',desc:'双键必须进主链，双键位次先于取代基',tools:'C'},
 {id:'oxygen',name:'含氧衍生物',family:'oxygen',desc:'醇 · 醛 · 酮 · 羧酸，官能团决定母体',tools:'CO'},
 {id:'ester',name:'酯的命名',family:'ester',desc:'羰基一侧是酸段，另一侧是醇段：某酸某酯',tools:'CO'},
 {id:'aromatic',name:'芳香烃',family:'aromatic',desc:'苯环编号 · 邻间对 · 多取代基顺序',tools:'CR'},
 {id:'generator',name:'命名生成器',family:'any',desc:'自由搭建结构，实时生成中文系统名',tools:'COR'}
];
var THEMES={
 night:{label:'夜幕',bg:['#00e5ff','#ff2d95']},
 dawn:{label:'曙',bg:['#ff8a00','#ff2d95']},
 washi:{label:'和纸',bg:['#00ffa3','#b967ff']}
};
function Shell(){
  var tabSt=React.useState(function(){
    var h0=location.hash.replace('#','');
    return APPS.some(function(a){return a.id===h0;})?h0:'alkane';
  });
  var tab=tabSt[0], setTab=tabSt[1];
  var thSt=React.useState(function(){
    var t=localStorage.getItem('zao-nl-theme');
    return THEMES[t]?t:'night';
  });
  var theme=thSt[0], setTheme=thSt[1];
  var sfxSt=React.useState(function(){ return localStorage.getItem('zao-nl-sfx')!=='0'; });
  var sfxOn=sfxSt[0], setSfxOn=sfxSt[1];
  React.useEffect(function(){
    if(window.SFX) SFX.setMuted(!sfxOn);
    try{ localStorage.setItem('zao-nl-sfx',sfxOn?'1':'0'); }catch(e){}
  },[sfxOn]);

  React.useEffect(function(){
    function onHash(){ var h0=location.hash.replace('#',''); if(APPS.some(function(a){return a.id===h0;})) setTab(h0); }
    window.addEventListener('hashchange',onHash);
    return function(){ window.removeEventListener('hashchange',onHash); };
  },[]);
  React.useEffect(function(){
    document.documentElement.setAttribute('data-theme',theme);
    try{ localStorage.setItem('zao-nl-theme',theme); }catch(e){}
    if(window.__setBgTheme) window.__setBgTheme(THEMES[theme].bg[0],THEMES[theme].bg[1]);
  },[theme]);

  var app=APPS.filter(function(a){return a.id===tab;})[0];
  return h('div',{className:'wrap'},
    h('header',{className:'top'},
      h('div',{className:'brand'},
        h('span',{className:'logo'},h('em',null,'化学视界'),' · 有机命名实验室'),
        h('span',{className:'tag'},'CHEMISTRY IN DAILY LIFE'),
        h('span',{className:'tag',style:{color:'var(--accent)',borderColor:'var(--accent)',fontWeight:900}},'v32')),
      h('div',{className:'themes'},
        Object.keys(THEMES).map(function(k){
          return h('button',{key:k,className:'tbtn'+(k===theme?' on':''),onClick:function(){ setTheme(k); }},THEMES[k].label);
        }),
        h('button',{className:'tbtn',title:'音效开关',onClick:function(){ setSfxOn(!sfxOn); }},sfxOn?'🔊':'🔇'),h('a',{className:'tbtn',href:'/teaching',style:{textDecoration:'none'}},'← 门户'),h('a',{className:'tbtn',href:'/',style:{textDecoration:'none'}},'⌂ 首页'))),
    h('nav',{className:'tabs'},
      APPS.map(function(a){
        return h('button',{key:a.id,className:'tab'+(a.id===tab?' on':''),onClick:function(){ location.hash=a.id; }},a.name);
      })),
    app.id==='generator'?h(GeneratorApp,{app:app}):h(GameApp,{key:app.id,app:app}),
    h('div',{style:{height:20}}));
}

/* ---------- 启动 ---------- */
var rootEl=document.getElementById('app');
if(ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(h(Shell));
else ReactDOM.render(h(Shell),rootEl);
})();
</script>
</body>
