<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有机命名实验室 · 化学视界 · v32</title>
<style>

/* ============ 化学视界 · 赛博朋克霓虹 ============ */
:root[data-theme="night"]{
  --bg:#04050d; --bg2:#0a0e22; --panel:#0d1233; --panel2:#141c4e;
  --ink:#eaf6ff; --muted:#7f8fc9; --line:#27327a;
  --accent:#00e5ff; --accent2:#ff2d95; --danger:#ff3860; --warn:#ffe74c;
  --node:#00e5ff; --btn-shadow:#01020a; --chip:#0a0f2c;
}
:root[data-theme="dawn"]{
  --bg:#170409; --bg2:#240812; --panel:#2b0a1a; --panel2:#3f1128;
  --ink:#ffeef6; --muted:#d68fb4; --line:#5e1e42;
  --accent:#ff2d95; --accent2:#ff8a00; --danger:#ff5c5c; --warn:#ffe74c;
  --node:#ff8ac2; --btn-shadow:#0c0105; --chip:#22060f;
}
:root[data-theme="washi"]{
  --bg:#060b0d; --bg2:#0b1518; --panel:#0e1c20; --panel2:#143037;
  --ink:#eafff6; --muted:#7fb8a8; --line:#1e4a4a;
  --accent:#00ffa3; --accent2:#b967ff; --danger:#ff5c7a; --warn:#ffe74c;
  --node:#5cffd6; --btn-shadow:#010806; --chip:#0a1a18;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  transition:background .35s,color .35s; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:46px 46px; opacity:.4;
  -webkit-mask-image:radial-gradient(ellipse at 50% 22%,#000 12%,transparent 80%);
  mask-image:radial-gradient(ellipse at 50% 22%,#000 12%,transparent 80%);
}
body.dmg::after{
  content:''; position:fixed; inset:0; z-index:60; pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(255,45,100,.32));
  animation:dmgfade .5s forwards;
}
@keyframes dmgfade{from{opacity:1}to{opacity:0}}
#app::after{
  content:''; position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
}
#bgfx{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.7;}
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}
.wrap{max-width:1100px; width:100%; margin:0 auto; padding:0 16px; flex:1; position:relative; z-index:1;}

/* ============ 头部 ============ */
header.top{padding:20px 0 8px; display:flex; align-items:center; justify-content:space-between; flex-wrap:nowrap; gap:10px;} .brand .tag{white-space:nowrap;} .themes{flex-shrink:0;} @media(max-width:768px){ .brand .tag{display:none;} .brand .logo{font-size:20px!important;} .tbtn{padding:4px 10px!important; font-size:12px!important;} }
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .logo{
  font-size:28px; font-weight:900; letter-spacing:2px;
  background:linear-gradient(92deg,var(--accent) 15%,#fff 50%,var(--accent2) 85%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 55%,transparent));
}
.brand .logo em{font-style:normal;}
.brand .tag{font-size:11px; color:var(--muted); letter-spacing:2px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; box-shadow:0 0 10px color-mix(in srgb,var(--line) 80%,transparent);}
.themes{display:flex; gap:8px;}
.tbtn{
  border:2px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; font-weight:700;
  box-shadow:0 4px 0 var(--btn-shadow); transition:transform .08s, box-shadow .08s;
}
.tbtn:active{transform:translateY(4px); box-shadow:0 0 0 var(--btn-shadow);}
.tbtn.on{border-color:var(--accent); color:var(--accent); box-shadow:0 4px 0 var(--btn-shadow),0 0 16px var(--accent);}

/* ============ Tab 栏 ============ */
nav.tabs{display:flex; gap:10px; margin:16px 0 20px; overflow-x:auto; padding-bottom:6px;}
.tab{
  flex:0 0 auto; border:2px solid var(--line); background:var(--panel); color:var(--ink);
  padding:10px 20px; border-radius:14px; font-size:15px; cursor:pointer; white-space:nowrap; font-weight:700;
  box-shadow:0 5px 0 var(--btn-shadow); transition:transform .08s, box-shadow .08s, border-color .2s;
}
.tab:active{transform:translateY(5px); box-shadow:0 0 0 var(--btn-shadow);}
.tab.on{
  border-color:transparent; color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 5px 0 var(--btn-shadow),0 0 22px color-mix(in srgb,var(--accent) 60%,transparent);
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* ============ 卡片与按钮 ============ */
.card{
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:2px solid var(--line); border-radius:16px; padding:20px; margin-bottom:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4);
}
.hbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:2px solid var(--line); background:linear-gradient(160deg,var(--panel2),var(--panel)); color:var(--ink);
  border-radius:14px; padding:11px 20px; font-size:15px; cursor:pointer; font-weight:800;
  box-shadow:0 6px 0 var(--btn-shadow); transition:transform .08s, box-shadow .08s, filter .15s;
  user-select:none; text-shadow:0 1px 0 rgba(0,0,0,.35);
}
.hbtn:hover{filter:brightness(1.15);}
.hbtn:active{transform:translateY(6px); box-shadow:0 0 0 var(--btn-shadow);}
.hbtn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent; color:#fff;
  box-shadow:0 6px 0 var(--btn-shadow),0 0 22px color-mix(in srgb,var(--accent) 55%,transparent);
}
.hbtn.good{background:linear-gradient(135deg,var(--accent2),color-mix(in srgb,var(--accent2) 55%,#fff)); border-color:transparent; color:#14000c;}
.hbtn.bad{background:linear-gradient(135deg,var(--danger),color-mix(in srgb,var(--danger) 60%,#fff)); border-color:transparent; color:#fff;}
.hbtn.ghost{background:transparent;}
.hbtn:disabled{opacity:.4; cursor:not-allowed;}
.hbtn.sm{padding:7px 13px; font-size:13px; border-radius:11px; box-shadow:0 4px 0 var(--btn-shadow);}
.hbtn.sm:active{transform:translateY(4px); box-shadow:0 0 0 var(--btn-shadow);}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.muted{color:var(--muted);}
h1{
  font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom:6px;
  background:linear-gradient(90deg,var(--accent),#fff,var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 12px color-mix(in srgb,var(--accent) 40%,transparent));
}
h2{font-size:20px; margin-bottom:10px; font-weight:800;}
.sub{color:var(--muted); font-size:14px; margin-bottom:16px;}

/* ============ 菜单 / 模式 ============ */
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px;}
.mode{cursor:pointer; text-align:left; position:relative; overflow:hidden; transition:transform .15s, box-shadow .2s;}
.mode:hover{transform:translateY(-3px); box-shadow:0 16px 34px rgba(0,0,0,.5),0 0 24px color-mix(in srgb,var(--accent) 25%,transparent); border-color:var(--accent);}
.mode::after{
  content:''; position:absolute; top:0; left:-80%; width:55%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);
  transform:skewX(-20deg); transition:left .55s;
}
.mode:hover::after{left:135%;}
.mode .mt{font-size:19px; font-weight:900; margin-bottom:6px;}
.mode .md{font-size:13px; color:var(--muted); line-height:1.6;}
.statline{font-size:13px; color:var(--muted); margin-top:14px;}

/* ============ 进度点 ============ */
.dots{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:var(--panel2);}
.dot.cur{border-color:var(--accent); background:var(--accent); box-shadow:0 0 12px var(--accent);}
.dot.ok{background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 12px var(--accent2); animation:dotpulse .5s;}
.dot.no{background:var(--danger); border-color:var(--danger); box-shadow:0 0 12px var(--danger);}
@keyframes dotpulse{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}

/* ============ 题目卡 ============ */
.qcard{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:2px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 0 30px rgba(0,0,0,.25);
}
.qname{
  font-size:26px; font-weight:900; letter-spacing:1px; color:var(--accent);
  text-shadow:0 0 16px color-mix(in srgb,var(--accent) 65%,transparent),0 0 40px color-mix(in srgb,var(--accent) 30%,transparent);
}
.qwrong{font-size:21px; font-weight:800; color:var(--danger); text-decoration:line-through; text-decoration-thickness:3px; text-shadow:0 0 12px color-mix(in srgb,var(--danger) 60%,transparent);}
.hint{margin-top:12px; font-size:13px; color:var(--warn); background:var(--chip); border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent); border-radius:10px; padding:9px 12px;}

/* ============ 分子画布 ============ */
.molwrap{
  background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--bg2) 80%,var(--accent) 6%),var(--bg) 88%);
  border:2px solid var(--line); border-radius:16px;
  overflow:hidden; position:relative; touch-action:none; cursor:grab;
  box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 8px 26px rgba(0,0,0,.4),0 0 24px color-mix(in srgb,var(--line) 70%,transparent);
}
.molwrap:active{cursor:grabbing;}
.molwrap svg{display:block; width:100%; height:340px;}
.molwrap line{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--node) 80%,transparent));}
.molhint{position:absolute; left:10px; bottom:8px; font-size:12px; color:var(--muted); pointer-events:none;}
.glowring{animation:ringpulse 1.8s ease-in-out infinite;}
@keyframes ringpulse{0%,100%{opacity:.35}50%{opacity:.95}}
.bond-new{animation:bondin .4s cubic-bezier(.2,1.6,.4,1);}
@keyframes bondin{0%{stroke-width:10;opacity:0}55%{stroke-width:7;opacity:1}100%{stroke-width:3.5;opacity:1}}
.node-pop{animation:nodein .35s cubic-bezier(.2,1.6,.4,1); transform-box:fill-box; transform-origin:center;}
@keyframes nodein{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ============ 拼字键盘 ============ */
.tiles{display:flex; gap:9px; flex-wrap:wrap; min-height:50px; background:var(--chip);
  border:2px dashed var(--line); border-radius:14px; padding:10px; margin-bottom:14px; align-items:center;}
.tile{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; border-radius:10px; padding:8px 12px;
  font-size:16px; font-weight:900; cursor:pointer;
  box-shadow:0 4px 0 var(--btn-shadow),0 0 16px color-mix(in srgb,var(--accent) 55%,transparent);
  transition:transform .08s, box-shadow .08s; animation:pop .18s ease;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.tile:nth-child(odd){transform:rotate(-2deg);}
.tile:nth-child(even){transform:rotate(2deg);}
.tile:active{transform:translateY(4px) rotate(0)!important; box-shadow:0 0 0 var(--btn-shadow);}
.tiles .ph{color:var(--muted); font-size:13px;}
.kgroup{margin-bottom:12px;}
.klabel{font-size:12px; color:var(--muted); margin-bottom:7px; letter-spacing:2px; font-weight:700;}
.krow{display:flex; gap:9px; flex-wrap:wrap;}
.key{
  background:linear-gradient(160deg,var(--panel2),var(--panel)); border:2px solid var(--line); color:var(--ink);
  border-radius:12px; padding:9px 14px; font-size:15px; font-weight:800; cursor:pointer;
  box-shadow:0 5px 0 var(--btn-shadow),inset 0 2px 0 rgba(255,255,255,.08),0 0 10px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s, filter .12s;
}
.key:hover{filter:brightness(1.2); transform:translateY(-1px); box-shadow:0 6px 0 var(--btn-shadow),0 0 16px color-mix(in srgb,var(--accent) 35%,transparent);}
.key:active{transform:translateY(5px); box-shadow:0 0 0 var(--btn-shadow);}
.key.wide{padding:9px 18px;}

/* ============ 反馈弹窗 ============ */
.overlay{position:fixed; inset:0; background:rgba(2,3,10,.65); backdrop-filter:blur(5px); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;}
.fbcard{
  background:linear-gradient(165deg,var(--panel),var(--panel2));
  border:3px solid var(--line); border-radius:24px;
  padding:30px 32px; max-width:430px; width:100%; text-align:center; position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:pop .32s cubic-bezier(.2,1.4,.4,1);
}
.fbcard.ok{border-color:var(--accent2); box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 44px color-mix(in srgb,var(--accent2) 55%,transparent);}
.fbcard.no{border-color:var(--danger); box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 44px color-mix(in srgb,var(--danger) 50%,transparent);}
.confetti{position:absolute; inset:0; pointer-events:none; overflow:visible;}
.confetti i{position:absolute; top:-8px; width:9px; height:13px; background:var(--c); opacity:0;
  animation:conf 1.15s ease-in forwards; animation-delay:var(--d); border-radius:2px;
  box-shadow:0 0 8px var(--c);}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),270px) rotate(var(--r))}}
.fbemoji{font-size:56px; line-height:1; margin-bottom:10px; filter:drop-shadow(0 0 14px rgba(255,255,255,.35));}
.fbtitle{font-size:24px; font-weight:900; margin-bottom:10px;}
.fbmsg{font-size:15px; color:var(--muted); line-height:1.7; margin-bottom:20px; word-break:break-all;}
.fbmsg b{color:var(--accent);}
@keyframes pop{0%{transform:scale(.5) rotate(-5deg); opacity:0;} 60%{transform:scale(1.08) rotate(2deg);} 100%{transform:scale(1) rotate(0); opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.shake{animation:shake .25s ease 2;}

/* ============ 结果 ============ */
.bigscore{
  font-size:68px; font-weight:900; text-align:center; margin:12px 0; color:var(--accent);
  text-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent),0 0 50px color-mix(in srgb,var(--accent) 35%,transparent);
  animation:bigpop .55s cubic-bezier(.2,1.5,.4,1);
}
@keyframes bigpop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.center{text-align:center;}

footer{padding:28px 0 36px; text-align:center; color:var(--muted); font-size:12px; letter-spacing:1px; line-height:1.9;}
.badge{display:inline-block; background:var(--accent2); color:#fff; border-radius:999px; padding:3px 12px; font-size:12px; font-weight:700; margin-left:8px;}
@media (max-width:640px){ .qname{font-size:21px;} .molwrap svg{height:280px;} h1{font-size:25px;} .bigscore{font-size:52px;} }


/* ============ v5: 修复与新增 ============ */
.mode{color:var(--ink);}
.mode .mt{color:var(--ink);}
.atom-ic{position:relative;display:inline-flex;width:38px;height:38px;vertical-align:-12px;margin-right:10px;perspective:90px;align-items:center;justify-content:center;}
.atom-ic b{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eaffff,var(--accent) 62%,transparent 140%);box-shadow:0 0 16px var(--accent);}
.atom-ic i{position:absolute;inset:1px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--accent) 70%,transparent);}
.atom-ic .r1{animation:orbA 3.6s linear infinite;}
.atom-ic .r2{animation:orbB 4.4s linear infinite;}
.atom-ic.mag b{background:radial-gradient(circle at 35% 30%,#ffe6f4,var(--accent2) 62%,transparent 140%);box-shadow:0 0 16px var(--accent2);}
.atom-ic.mag i{border-color:color-mix(in srgb,var(--accent2) 70%,transparent);}
@keyframes orbA{from{transform:rotateX(62deg) rotateZ(0)}to{transform:rotateX(62deg) rotateZ(360deg)}}
@keyframes orbB{from{transform:rotateX(-62deg) rotateZ(360deg)}to{transform:rotateX(-62deg) rotateZ(0)}}
.elbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--btn-shadow);transition:transform .08s,box-shadow .08s;font-family:inherit;}
.elbtn i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor;}
.elbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--btn-shadow);}
.elbtn.on{border-color:var(--accent);color:var(--accent);box-shadow:0 4px 0 var(--btn-shadow),0 0 14px var(--accent);}

/* ============ 选中水波纹 ============ */
.ripple{transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 2.2s cubic-bezier(.2,.6,.4,1) infinite;}
.ripple.r1{animation-delay:.73s;}
.ripple.r2{animation-delay:1.46s;}
@keyframes ripple{0%{transform:scale(.55);opacity:.85;}100%{transform:scale(3);opacity:0;}}
</style>

<script>
/* ================================================================
 * 有机命名实验室 · 核心引擎（纯 JS，无依赖）
 * 图模型: graph = { nodes:[{id,el:'C'|'O',arom,x,y}], edges:[{a,b,order}] }
 * ================================================================ */
(function(){
"use strict";
var NL = window.NL = {};

/* ---------- 工具 ---------- */
NL.norm = function(s){
  return String(s==null?'':s).replace(/\s+/g,'')
    .replace(/，/g,',').replace(/[、·]/g,',').replace(/[–—－]/g,'-')
    .replace(/（/g,'(').replace(/）/g,')');
};
NL.shuffle = function(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
};
NL.pick = function(arr,n){ return NL.shuffle(arr).slice(0,n); };

/* ---------- 构图 ---------- */
var __nid=0;
function nid(p){ return p+(++__nid); }
function newG(){ return {nodes:[],edges:[]}; }
function addC(g,arom){ var id=nid('c'); g.nodes.push({id:id,el:'C',arom:!!arom}); return id; }
function addO(g){ var id=nid('o'); g.nodes.push({id:id,el:'O'}); return id; }
function bond(g,a,b,order){ g.edges.push({a:a,b:b,order:order||1}); }
function attach(g,at,kind){
  if(kind==='methyl'){ bond(g,at,addC(g)); }
  else if(kind==='ethyl'){ var a=addC(g),b=addC(g); bond(g,at,a); bond(g,a,b); }
  else if(kind==='propyl'){ var a=addC(g),b=addC(g),c=addC(g); bond(g,at,a); bond(g,a,b); bond(g,b,c); }
  else if(kind==='butyl'){ var a=addC(g),b=addC(g),c=addC(g),d=addC(g); bond(g,at,a); bond(g,a,b); bond(g,b,c); bond(g,c,d); }
  else if(kind==='isopropyl'){ var c=addC(g); bond(g,at,c); bond(g,c,addC(g)); bond(g,c,addC(g)); }
  else if(kind==='isobutyl'){ var a=addC(g),m=addC(g); bond(g,at,a); bond(g,a,m); bond(g,m,addC(g)); bond(g,m,addC(g)); }
}
function chain(g,n){ var ids=[]; for(var i=0;i<n;i++) ids.push(addC(g)); for(i=0;i<n-1;i++) bond(g,ids[i],ids[i+1]); return ids; }
function addSubs(g,ids,subs){ (subs||[]).forEach(function(s){ attach(g,ids[s.pos-1],s.kind); }); }

NL.buildGraph = function(family,spec){
  __nid=0; var g=newG(),ids;
  switch(family){
    case 'alkane': ids=chain(g,spec.n); addSubs(g,ids,spec.subs); break;
    case 'alkene':
      ids=chain(g,spec.n); addSubs(g,ids,spec.subs);
      bond(g,ids[spec.d-1],ids[spec.d],2); break;
    case 'alcohol':
      ids=chain(g,spec.n); addSubs(g,ids,spec.subs);
      bond(g,ids[spec.oh-1],addO(g)); break;
    case 'aldehyde':
      ids=chain(g,spec.n); addSubs(g,ids,spec.subs);
      bond(g,ids[0],addO(g),2); break;
    case 'ketone':
      ids=chain(g,spec.n); addSubs(g,ids,spec.subs);
      bond(g,ids[spec.k-1],addO(g),2); break;
    case 'acid':
      ids=chain(g,spec.n); addSubs(g,ids,spec.subs);
      bond(g,ids[0],addO(g),2); bond(g,ids[0],addO(g)); break;
    case 'ester':{
      var c0=addC(g); bond(g,c0,addO(g),2);
      var oo=addO(g); bond(g,c0,oo);
      var prev=oo;
      for(var i=0;i<spec.r;i++){ var c=addC(g); bond(g,prev,c); prev=c; }
      prev=c0;
      for(i=1;i<spec.a;i++){ c=addC(g); bond(g,prev,c); prev=c; }
      break; }
    case 'aromatic':{
      var ring=[];
      for(var i=0;i<6;i++) ring.push(addC(g,true));
      for(i=0;i<6;i++){ bond(g,ring[i],ring[(i+1)%6]);
        var ang=Math.PI/6*2*i; g.nodes[g.nodes.length-6+i].x=260*Math.cos(ang); g.nodes[g.nodes.length-6+i].y=260*Math.sin(ang); }
      (spec.subs||[]).forEach(function(s){ attach(g,ring[s.pos-1],s.kind); });
      break; }
  }
  return g;
};

/* ---------- 命名表 ---------- */
var ALKANE=['','甲烷','乙烷','丙烷','丁烷','戊烷','己烷','庚烷','辛烷','壬烷','癸烷'];

var ALDEHYDE=['','甲醛','乙醛','丙醛','丁醛','戊醛','己醛','庚醛','辛醛','壬醛','癸醛'];
var KETONE=['','','','丙酮','丁酮','戊酮','己酮','庚酮','辛酮','壬酮','癸酮'];
var ACID=['','甲酸','乙酸','丙酸','丁酸','戊酸','己酸','庚酸','辛酸','壬酸','癸酸'];
var ROOT1=['','甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var CNT=['','','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
var SUBEN={methyl:'methyl',ethyl:'ethyl',propyl:'propyl',butyl:'butyl',isopropyl:'isopropyl',isobutyl:'isobutyl',fluoro:'fluoro',chloro:'chloro',bromo:'bromo',iodo:'iodo',hydroxy:'hydroxy',amino:'amino',mercapto:'mercapto'};
var SUBCN={methyl:'甲基',ethyl:'乙基',propyl:'丙基',butyl:'丁基',isopropyl:'异丙基',isobutyl:'异丁基',fluoro:'氟',chloro:'氯',bromo:'溴',iodo:'碘',hydroxy:'羟基',amino:'氨基',mercapto:'巯基'};

/* ---------- 图算法 ---------- */
function buildAdj(g){
  var adj={};
  g.nodes.forEach(function(n){ adj[n.id]=[]; });
  g.edges.forEach(function(e){
    if(adj[e.a]&&adj[e.b]){ adj[e.a].push({id:e.b,order:e.order}); adj[e.b].push({id:e.a,order:e.order}); }
  });
  return adj;
}
function carbonSet(g){ var s={}; g.nodes.forEach(function(n){ if(n.el==='C') s[n.id]=1; }); return s; }
function connected(g){
  if(!g.nodes.length) return false;
  var adj=buildAdj(g), seen={}, q=[g.nodes[0].id], head=0; seen[q[0]]=1;
  while(head<q.length){ var cur=q[head++]; (adj[cur]||[]).forEach(function(e){ if(!seen[e.id]){ seen[e.id]=1; q.push(e.id); } }); }
  return q.length===g.nodes.length;
}

/* 枚举以 start 出发的所有简单路径(仅碳) */
function enumPaths(adj,C,start){
  var paths=[];
  (function dfs(path,vis){
    var last=path[path.length-1], ext=false;
    var es=adj[last]||[];
    for(var i=0;i<es.length;i++){
      var e=es[i];
      if(vis[e.id]||!C[e.id]) continue;
      ext=true; vis[e.id]=1; path.push(e.id);
      dfs(path,vis);
      path.pop(); delete vis[e.id];
    }
    if(!ext) paths.push(path.slice());
  })([start],(function(){var o={};o[start]=1;return o;})());
  return paths;
}

/* 主链外取代基提取: path 为主链(节点id数组), 返回 [{locant,name,en}] */
function extractSubs(g,path,skip){
  var adj=buildAdj(g), inP={}, i;
  path.forEach(function(p){ inP[p]=1; });
  var off={}; g.nodes.forEach(function(n){ if(n.el==='C'&&!inP[n.id]) off[n.id]=1; });
  var res=[], seen={};
  for(var pi=0;pi<path.length;pi++){
    var pid=path[pi];
    var es=adj[pid]||[];
    for(var k=0;k<es.length;k++){
      var nid2=es[k].id;
      if(inP[nid2]||!off[nid2]||seen[nid2]) continue;
      // 该取代基区域内最长简单路径
      var best=[nid2];
      (function dfs(p,vis){
        if(p.length>best.length) best=p.slice();
        var last=p[p.length-1], es2=adj[last]||[];
        for(var j=0;j<es2.length;j++){
          var e2=es2[j];
          if(!off[e2.id]||inP[e2.id]||vis[e2.id]) continue;
          vis[e2.id]=1; p.push(e2.id); dfs(p,vis); p.pop(); delete vis[e2.id];
        }
      })([nid2],(function(){var o={};o[nid2]=1;return o;})());
      best.forEach(function(id){ seen[id]=1; });
      // 支链碳: 区域内不在 best 上的节点
      var bp={}; best.forEach(function(id){ bp[id]=1; });
      var branch=0, attachIdx=-1;
      var q=[nid2], vq={}; vq[nid2]=1;
      while(q.length){
        var x=q.pop();
        (adj[x]||[]).forEach(function(e2){
          if(!off[e2.id]||inP[e2.id]||vq[e2.id]) return;
          vq[e2.id]=1;
          if(!bp[e2.id]){ branch++; var bi=best.indexOf(x); if(attachIdx<0||bi<attachIdx) attachIdx=bi; }
          q.push(e2.id);
        });
      }
      var kk=best.length, name;
      if(kk===2&&branch===1&&attachIdx===0) name='isopropyl';
      else if(kk===3&&branch===1&&attachIdx===1) name='isobutyl';
      else name=['','methyl','ethyl','propyl','butyl','pentyl','hexyl'][kk]||'hexyl';
      res.push({locant:pi+1,name:name,en:SUBEN[name]||name});
    }
  }
  /* 杂原子取代基：卤素 + 羟基/氨基/巯基（skip 中的是母体官能团，不作前缀） */
  var PRE={O:'hydroxy',N:'amino',S:'mercapto'};
  for(var ph=0;ph<path.length;ph++){
    var esh=adj[path[ph]]||[];
    for(var kh=0;kh<esh.length;kh++){
      var hid=esh[kh].id;
      if(inP[hid]||(skip&&skip[hid])) continue;
      var hnode=g.nodes.filter(function(n){return n.id===hid;})[0];
      if(!hnode) continue;
      var nm2=HAL[hnode.el]||PRE[hnode.el];
      if(nm2) res.push({locant:ph+1,name:nm2,en:nm2});
    }
  }
  return res;
}

/* 评分: path + 方向 → 排序键 */
function orientKey(g,path,dir,feat,skip){
  var p = dir>0 ? path : path.slice().reverse();
  var featLoc=0;
  if(feat&&feat.type==='alkene'){
    var i1=p.indexOf(feat.c1), i2=p.indexOf(feat.c2);
    featLoc=Math.min(i1,i2)+1;
  }else if(feat&&(feat.type==='oh'||feat.type==='carbonyl')){
    featLoc=p.indexOf(feat.c)+1;
  }
  var subs=extractSubs(g,p,skip);
  var locs=subs.map(function(s){return s.locant;}).sort(function(a,b){return a-b;});
  var key=[featLoc].concat(locs);
  var byEn=subs.slice().sort(function(a,b){ return a.en<b.en?-1:(a.en>b.en?1:0); });
  var key2 = byEn.length ? byEn[0].locant : 0;
  return {key:key,key2:key2,subs:subs,featLoc:featLoc,chain:p};
}

function cmpKey(a,b){
  for(var i=0;i<Math.min(a.length,b.length);i++){ if(a[i]!==b[i]) return a[i]-b[i]; }
  return a.length-b.length;
}

/* 最长主链: mustStart=必须从该碳出发, mustIn=必须包含的碳集合, feat=特征 */
function bestChain(g,mustStart,mustIn,feat,skip){
  var adj=buildAdj(g), C=carbonSet(g);
  var starts = mustStart ? [mustStart] : Object.keys(C);
  var best=null;
  starts.forEach(function(s){
    enumPaths(adj,C,s).forEach(function(path){
      if(mustIn){
        for(var i=0;i<mustIn.length;i++) if(path.indexOf(mustIn[i])<0) return;
      }
      var o1=orientKey(g,path,1,feat,skip), o2=orientKey(g,path,-1,feat,skip);
      var c12=cmpKey(o1.key,o2.key);
      var o = c12<0 ? o1 : (c12>0 ? o2 : (o1.key2<=o2.key2 ? o1 : o2));
      var cand={len:path.length,key:o.key,key2:o.key2,subs:o.subs,featLoc:o.featLoc,chain:o.chain};
      if(!best || cand.len>best.len ||
         (cand.len===best.len && (cmpKey(cand.key,best.key)<0 ||
           (cmpKey(cand.key,best.key)===0 && cand.key2<best.key2)))) best=cand;
    });
  });
  return best;
}

function assemble(subs,featLoc,parentName){
  var groups={};
  subs.forEach(function(s){ (groups[s.name]=groups[s.name]||[]).push(s.locant); });
  var names=Object.keys(groups);
  names.sort(function(a,b){ return SUBEN[a]<SUBEN[b]?-1:(SUBEN[a]>SUBEN[b]?1:0); });
  var parts=names.map(function(nm){
    var ls=groups[nm].sort(function(a,b){return a-b;});
    var cn = ls.length>1 ? CNT[ls.length]+SUBCN[nm] : SUBCN[nm];
    return ls.join(',')+'-'+cn;
  });
  // 母体带位次时用“-”连接，否则取代基直接连母体（如 2-甲基己烷）
  if(featLoc>0){ parts.push(featLoc+'-'+parentName); return parts.join('-'); }
  return parts.join('-')+parentName;
}

/* ---------- 特征检测 ---------- */
function findCarbonyl(g){
  for(var i=0;i<g.edges.length;i++){
    var e=g.edges[i];
    if(e.order!==2) continue;
    var a=g.nodes.filter(function(n){return n.id===e.a;})[0];
    var b=g.nodes.filter(function(n){return n.id===e.b;})[0];
    if(!a||!b) continue;
    if(a.el==='C'&&b.el==='O') return {c:a.id,o:b.id};
    if(b.el==='C'&&a.el==='O') return {c:b.id,o:a.id};
  }
  return null;
}
function neighbors(g,id){
  var adj=buildAdj(g), res=[];
  (adj[id]||[]).forEach(function(e){ res.push({id:e.id,order:e.order}); });
  return res;
}
function elOf(g,id){ var n=g.nodes.filter(function(x){return x.id===id;})[0]; return n?n.el:''; }

var HAL={F:'fluoro',Cl:'chloro',Br:'bromo',I:'iodo'};
function findRing(g){
  if(g.nodes.length>60) return null;
  var adj=buildAdj(g), best=null;
  g.nodes.forEach(function(st){
    (function dfs(cur,parent,path,vis){
      if(path.length>40) return;
      var es=adj[cur]||[];
      for(var i=0;i<es.length;i++){
        var nid=es[i].id;
        if(nid===parent) continue;
        if(vis[nid]){
          if(nid===st.id&&path.length>=3&&(!best||path.length>best.length)) best=path.slice();
          continue;
        }
        vis[nid]=1; path.push(nid);
        dfs(nid,cur,path,vis);
        path.pop(); delete vis[nid];
      }
    })(st.id,null,[st.id],(function(){var o={};o[st.id]=1;return o;})());
  });
  return best;
}
/* 最小环查找：优先 ≥5 元的最小环（十氢萘式稠环按两个六元环处理） */
function findRingMin(g){
  if(g.nodes.length>60) return null;
  var adj=buildAdj(g), best5=null, bestAny=null;
  g.nodes.forEach(function(st){
    (function dfs(cur,parent,path,vis){
      if(path.length>40) return;
      var es=adj[cur]||[];
      for(var i=0;i<es.length;i++){
        var nid=es[i].id;
        if(nid===parent) continue;
        if(vis[nid]){
          if(nid===st.id&&path.length>=3){
            if(!bestAny||path.length<bestAny.length) bestAny=path.slice();
            if(path.length>=5&&(!best5||path.length<best5.length)) best5=path.slice();
          }
          continue;
        }
        vis[nid]=1; path.push(nid);
        dfs(nid,cur,path,vis);
        path.pop(); delete vis[nid];
      }
    })(st.id,null,[st.id],(function(){var o={};o[st.id]=1;return o;})());
  });
  return best5||bestAny;
}
/* ---------- 主命名入口 ---------- */
NL.nameMolecule = function(g){
  if(!g||!g.nodes.length||!connected(g)) return null;
  var arom=g.nodes.filter(function(n){return n.arom;});
  if(arom.length) return nameAromatic(g);

  /* 环状烃：纯环(环烷/环烯) 或 简单烷基/卤素取代的饱和环 */
  var cycR=findRing(g);
  if(cycR&&cycR.length>=3){
    var m=cycR.length;
    var inC={}; cycR.forEach(function(id){inC[id]=1;});
    var adjR=buildAdj(g);
    var subs=[], okR=true, prinL=null;
    for(var ri=0;ri<m&&okR;ri++){
      var es=adjR[cycR[ri]]||[];
      for(var ki=0;ki<es.length&&okR;ki++){
        var nb=es[ki].id;
        if(inC[nb]) continue;
        var nd=g.nodes.filter(function(n){return n.id===nb;})[0];
        if(!nd){ okR=false; break; }
        if(HAL[nd.el]){ subs.push({ri:ri,name:HAL[nd.el]}); continue; }
        if(nd.el==='O'||nd.el==='S'||nd.el==='N'){ if(prinL) okR=false; else prinL={ri:ri,el:nd.el}; continue; }
        if(nd.el!=='C'){ okR=false; break; }
        var region={};
        (function collect(x,from){
          region[x]=1;
          (adjR[x]||[]).forEach(function(e2){
            var y=e2.id;
            if(inC[y]||y===from||region[y]) return;
            var yn=g.nodes.filter(function(n){return n.id===y;})[0];
            if(yn&&yn.el==='C') collect(y,x);
          });
        })(nb,cycR[ri]);
        var rNodes=Object.keys(region);
        var degOK=rNodes.every(function(x){
          var c=0;
          (adjR[x]||[]).forEach(function(e2){ if(region[e2.id]) c++; });
          return c<=2;
        });
        if(!degOK){ okR=false; break; }
        subs.push({ri:ri,len:rNodes.length});
      }
    }
    if(okR){
      var dblR=0;
      g.edges.forEach(function(e){ if(e.order===2&&inC[e.a]&&inC[e.b]) dblR++; });
      var ALKY=['','methyl','ethyl','propyl','butyl','pentyl','hexyl'];
      var KINDS={O:'醇',S:'硫醇',N:'胺'};
      if(!subs.length&&!prinL){
        if(dblR===1&&ALKENE[m]) return '环'+ALKENE[m];
        if(!dblR) return '环'+(ALKANE[m]||('碳'+m+'烷'));
      }else if(!dblR){
        var base='环'+(ALKANE[m]||('碳'+m+'烷')).replace(/烷$/, prinL?KINDS[prinL.el]:'烷');
        var bestN=null;
        if(prinL){
          for(var d2=-1;d2<=1;d2+=2){
            var pl2=subs.map(function(sb){
              var p=((sb.ri-prinL.ri)*d2)%m; if(p<0)p+=m;
              return {loc:p+1,sb:sb};
            });
            var locs2=pl2.map(function(x){return x.loc;}).sort(function(a,b){return a-b;});
            var fe2s=pl2.slice().sort(function(a,b){
              var ea=a.sb.en||SUBEN[ALKY[a.sb.len]]||'z', eb=b.sb.en||SUBEN[ALKY[b.sb.len]]||'z';
              return ea<eb?-1:(ea>eb?1:0);
            });
            var firstEn2=fe2s.length?fe2s[0].loc:0;
            if(!bestN||cmpKey(locs2,bestN.locs)<0||(cmpKey(locs2,bestN.locs)===0&&firstEn2<bestN.firstEn))
              bestN={s:prinL.ri,d:d2,locs:locs2,firstEn:firstEn2};
          }
        }else{
        for(var s=0;s<m;s++){
          for(var d=-1;d<=1;d+=2){
            var pl=subs.map(function(sb){
              var p=((sb.ri-s)*d)%m; if(p<0)p+=m;
              return {loc:p+1,sb:sb};
            });
            var locs=pl.map(function(x){return x.loc;}).sort(function(a,b){return a-b;});
            var fe1s=pl.slice().sort(function(a,b){
              var ea=a.sb.en||SUBEN[ALKY[a.sb.len]]||'z', eb=b.sb.en||SUBEN[ALKY[b.sb.len]]||'z';
              return ea<eb?-1:(ea>eb?1:0);
            });
            var firstEn=fe1s.length?fe1s[0].loc:0;
            if(!bestN||cmpKey(locs,bestN.locs)<0||(cmpKey(locs,bestN.locs)===0&&firstEn<bestN.firstEn))
              bestN={s:s,d:d,locs:locs,firstEn:firstEn};
          }
        }
        }
        var placed=subs.map(function(sb){
          var p=((sb.ri-bestN.s)*bestN.d)%m; if(p<0)p+=m;
          return {loc:p+1,sb:sb};
        });
        placed.sort(function(a,b){
          var ea=a.sb.en||SUBEN[ALKY[a.sb.len]]||'z', eb=b.sb.en||SUBEN[ALKY[b.sb.len]]||'z';
          return ea<eb?-1:(ea>eb?1:0);
        });
        var groups={};
        placed.forEach(function(x){
          var key=x.sb.name||ALKY[x.sb.len];
          (groups[key]=groups[key]||[]).push(x.loc);
        });
        var gks=Object.keys(groups).sort(function(a,b){return SUBEN[a]<SUBEN[b]?-1:1;});
        var parts=gks.map(function(k){
          var ls=groups[k].sort(function(a,b){return a-b;});
          return ls.join(',')+'-'+(ls.length>1?CNT[ls.length]:'')+SUBCN[k];
        });
        return parts.join('-')+base;
      }else if(dblR===1&&ALKENE[m]&&subs.length){
        /* 环烯+取代基：双键碳固定 1,2 号，取代基位次最小 */
        var dblAt=[];
        g.edges.forEach(function(e){ if(e.order===2&&inC[e.a]&&inC[e.b]){ dblAt=[cycR.indexOf(e.a),cycR.indexOf(e.b)]; } });
        var bestE=null;
        for(var se=0;se<m;se++){
          for(var de=-1;de<=1;de+=2){
            var dl=dblAt.map(function(x){ var p=((x-se)*de)%m; if(p<0)p+=m; return p+1; }).sort(function(a,b){return a-b;});
            if(dl[0]!==1||dl[1]!==2) continue;
            var ple=subs.map(function(sb){
              var p=((sb.ri-se)*de)%m; if(p<0)p+=m;
              return {loc:p+1,sb:sb};
            });
            var locse=ple.map(function(x){return x.loc;}).sort(function(a,b){return a-b;});
            var feE=ple.slice().sort(function(a,b){
              var ea=a.sb.en||SUBEN[['','methyl','ethyl','propyl','butyl','pentyl'][a.sb.len]]||'z';
              var eb=b.sb.en||SUBEN[['','methyl','ethyl','propyl','butyl','pentyl'][b.sb.len]]||'z';
              return ea<eb?-1:(ea>eb?1:0);
            });
            var firstE=feE.length?feE[0].loc:0;
            if(!bestE||cmpKey(locse,bestE.locs)<0||(cmpKey(locse,bestE.locs)===0&&firstE<bestE.firstLoc))

          }
        }
        if(bestE){
          var ple2=subs.map(function(sb){
            var p=((sb.ri-bestE.s)*bestE.d)%m; if(p<0)p+=m;
            return {loc:p+1,sb:sb};
          });
          ple2.sort(function(a,b){
            var ea=a.sb.en||SUBEN[['','methyl','ethyl','propyl','butyl','pentyl'][a.sb.len]]||'z';
            var eb=b.sb.en||SUBEN[['','methyl','ethyl','propyl','butyl','pentyl'][b.sb.len]]||'z';
            return ea<eb?-1:(ea>eb?1:0);
          });
          var groups2={};
          ple2.forEach(function(x){
            var key=x.sb.name||['','methyl','ethyl','propyl','butyl','pentyl'][x.sb.len];
            (groups2[key]=groups2[key]||[]).push(x.loc);
          });
          var gks2=Object.keys(groups2).sort(function(a,b){return SUBEN[a]<SUBEN[b]?-1:1;});
          var parts2b=gks2.map(function(k){
            var ls=groups2[k].sort(function(a,b){return a-b;});
            return ls.join(',')+'-'+(ls.length>1?CNT[ls.length]:'')+SUBCN[k];
          });
          return parts2b.join('-')+'环'+ALKENE[m];
        }
      }
    }
  }

  /* 酯: C(=O)-O-C */
  var cb=findCarbonyl(g);
  if(cb){
    var nb=neighbors(g,cb.c).filter(function(e){return e.order===1&&elOf(g,e.id)==='O';});
    for(var i=0;i<nb.length;i++){
      var o2=nb[i].id, nb2=neighbors(g,o2).filter(function(e){return e.id!==cb.c;});
      if(nb2.length===1&&elOf(g,nb2[0].id)==='C'){
        var acyl=bestChain(g,cb.c,[cb.c],null);
        var alkyl=bestChain(g,nb2[0].id,[nb2[0].id],null);
        if(acyl&&alkyl)
          return ROOT1[acyl.len]+'酸'+ROOT1[alkyl.len]+'酯';
      }
    }
    /* 羧酸: C(=O)-O(H) */
    for(i=0;i<nb.length;i++){
      o2=nb[i].id; nb2=neighbors(g,o2).filter(function(e){return e.id!==cb.c;});
      if(nb2.length===0){
        var ch=bestChain(g,cb.c,[cb.c],{type:'carbonyl',c:cb.c},{[cb.o]:1});
        if(ch) return assemble(ch.subs,0,ACID[ch.len]||('碳'+ch.len+'酸'));
      }
    }
    /* 醛: 羰基碳只有一个碳邻居(0 个 = 甲醛) */
    var cn=neighbors(g,cb.c).filter(function(e){return elOf(g,e.id)==='C';});
    if(cn.length<=1){
      ch=bestChain(g,cb.c,[cb.c],{type:'carbonyl',c:cb.c},{[cb.o]:1});
      if(ch) return assemble(ch.subs,0,ALDEHYDE[ch.len]||('碳'+ch.len+'醛'));
    }
    /* 酮 */
    if(cn.length===2){
      ch=bestChain(g,null,[cb.c],{type:'carbonyl',c:cb.c},{[cb.o]:1});
      if(ch){
        var kn=KETONE[ch.len]||('碳'+ch.len+'酮');
        var kl=ch.len<=3?0:ch.featLoc;
        return assemble(ch.subs,kl,kn);
      }
    }
  }
  /* 醇 */
  var ohs=g.nodes.filter(function(n){return n.el==='O';});
  for(i=0;i<ohs.length;i++){
    var on=neighbors(g,ohs[i].id).filter(function(e){return e.order===1;});
    var hasDbl=g.edges.some(function(e){return (e.a===ohs[i].id||e.b===ohs[i].id)&&e.order===2;});
    if(on.length===1&&!hasDbl){
      var oc=on[0].id;
      ch=bestChain(g,null,[oc],{type:'oh',c:oc},{[ohs[i].id]:1});
      if(ch){
        var pn=ALCOHOL[ch.len]||('碳'+ch.len+'醇');
        var fl=ch.len<=2?0:ch.featLoc;
        return assemble(ch.subs,fl,pn);
      }
    }
  }
  /* 含硫：硫醇(S连1碳) / 硫醚(S连2碳) */
  var sn2=g.nodes.filter(function(n){return n.el==='S';})[0];
  if(sn2){
    var scn=neighbors(g,sn2.id).filter(function(e){return elOf(g,e.id)==='C';});
    if(scn.length===1){
      ch=bestChain(g,null,[scn[0].id],null,{[sn2.id]:1});
      if(ch) return assemble(ch.subs,0,(ALKANE[ch.len]||('碳'+ch.len+'烷')).replace(/烷$/,'硫醇'));
    }else if(scn.length===2){
      var sa1=bestChain(g,scn[0].id,[scn[0].id],null);
      var sa2=bestChain(g,scn[1].id,[scn[1].id],null);
      if(sa1&&sa2){
        if(sa1.len===sa2.len) return '二'+ROOT1[sa1.len]+'硫醚';
        var sab=[sa1.len,sa2.len].sort(function(a,b){return a-b;});
        return ROOT1[sab[0]]+ROOT1[sab[1]]+'硫醚';
      }
    }
  }
  /* 含氮：胺(N连1~3碳) */
  var nn2=g.nodes.filter(function(n){return n.el==='N';})[0];
  if(nn2){
    var ncn=neighbors(g,nn2.id).filter(function(e){return elOf(g,e.id)==='C';});
    if(ncn.length===1){
      ch=bestChain(g,null,[ncn[0].id],null,{[nn2.id]:1});
      if(ch) return assemble(ch.subs,0,(ALKANE[ch.len]||('碳'+ch.len+'烷')).replace(/烷$/,'胺'));
    }else if(ncn.length>=2){
      var arms=ncn.map(function(e){ return bestChain(g,e.id,[e.id],null); });
      if(arms.every(function(a){return !!a;})){
        var lens=arms.map(function(a){return a.len;}).sort(function(a,b){return a-b;});
        var allEq=lens.every(function(L){return L===lens[0];});
        if(allEq) return CNT[lens.length]+ROOT1[lens[0]]+'胺';
        return lens.map(function(L){return ROOT1[L];}).join('')+'胺';
      }
    }
  }
  /* 烯 */
  var dbl=null;
  for(i=0;i<g.edges.length;i++){
    var e=g.edges[i];
    if(e.order===2&&elOf(g,e.a)==='C'&&elOf(g,e.b)==='C'){ dbl={c1:e.a,c2:e.b}; break; }
  }
  if(dbl){
    ch=bestChain(g,null,[dbl.c1,dbl.c2],{type:'alkene',c1:dbl.c1,c2:dbl.c2});
    if(ch){
      var en=ALKENE[ch.len]||('碳'+ch.len+'烯');
      var el2=ch.len<=3?0:ch.featLoc;
      return assemble(ch.subs,el2,en);
    }
  }
  /* 烷 */
  ch=bestChain(g,null,null,null);
  if(ch) return assemble(ch.subs,0,ALKANE[ch.len]||('碳'+ch.len+'烷'));
  return null;
};

/* ---------- 芳香烃命名 ---------- */
function nameAromatic(g){
  var ring=g.nodes.filter(function(n){return n.arom;}).map(function(n){return n.id;});
  if(ring.length!==6) return null;
  var adj=buildAdj(g), rs={};
  ring.forEach(function(r){ rs[r]=1; });
  // 环排序
  var order=[ring[0]], prev=null, cur=ring[0];
  while(order.length<6){
    var nx=null, es=adj[cur]||[];
    for(var i=0;i<es.length;i++){
      if(rs[es[i].id]&&es[i].id!==prev&&order.indexOf(es[i].id)<0){ nx=es[i].id; break; }
    }
    if(!nx) return null;
    prev=cur; cur=nx; order.push(cur);
  }
  /* 每个环碳的取代基：卤素叶 / 烷基区域（异丙基、叔丁基、复合支链） */
  var subs=[];
  var HALE={F:'fluoro',Cl:'chloro',Br:'bromo',I:'iodo'};
  var ALKE=['','methyl','ethyl','propyl','butyl','pentyl','hexyl','heptyl','octyl','nonyl','decyl'];
  for(i=0;i<6;i++){
    var es2=adj[order[i]]||[];
    for(var k=0;k<es2.length;k++){
      var nb2=es2[k].id;
      if(rs[nb2]) continue;
      var nd=g.nodes.filter(function(n){return n.id===nb2;})[0];
      if(!nd) continue;
      if(HALE[nd.el]){ subs.push({ri:i,cn:SUBCN[HALE[nd.el]],key:HALE[nd.el],kind:'hal'}); continue; }
      if(nd.el==='O'||nd.el==='N'||nd.el==='S'){ var pk={O:'hydroxy',N:'amino',S:'mercapto'}[nd.el]; subs.push({ri:i,cn:SUBCN[pk],key:pk,kind:'pre'}); continue; }
      if(nd.el!=='C') continue;
      var region={};
      (function collect(x,from){
        region[x]=1;
        (adj[x]||[]).forEach(function(e2){
          var y=e2.id;
          if(rs[y]||y===from||region[y]) return;
          var yn=g.nodes.filter(function(n){return n.id===y;})[0];
          if(yn&&yn.el==='C') collect(y,x);
        });
      })(nb2,order[i]);
      var rN=Object.keys(region);
      var aDeg=(adj[nb2]||[]).filter(function(e2){return region[e2.id];}).length;
      if(rN.length===3&&aDeg===2){ subs.push({ri:i,cn:'异丙基',key:'isopropyl',kind:'iso'}); continue; }
      if(rN.length===4&&aDeg===3){ subs.push({ri:i,cn:'叔丁基',key:'tertbutyl',kind:'tert'}); continue; }
      var best=[nb2];
      (function dfs(p,vis){
        if(p.length>best.length) best=p.slice();
        var es3=adj[p[p.length-1]]||[];
        for(var j=0;j<es3.length;j++){
          var e3=es3[j];
          if(!region[e3.id]||vis[e3.id]) continue;
          vis[e3.id]=1; p.push(e3.id); dfs(p,vis); p.pop(); delete vis[e3.id];
        }
      })([nb2],(function(){var o={};o[nb2]=1;return o;})());
      var bp={}; best.forEach(function(id){bp[id]=1;});
      var extra=rN.filter(function(id){return !bp[id];});
      if(best.length===1&&!extra.length){
        subs.push({ri:i,cn:'甲基',key:'methyl',kind:'alk1'});
        continue;
      }
      /* 复合取代基：路径卤素 + 一层支链 */
      var items=[];
      best.forEach(function(pp,j){
        (adj[pp]||[]).forEach(function(e2){
          if(rs[e2.id]||region[e2.id]||bp[e2.id]) return;
          var yn=g.nodes.filter(function(n){return n.id===e2.id;})[0];
          if(yn&&HALE[yn.el]) items.push({loc:j+1,en:HALE[yn.el],cn:SUBCN[HALE[yn.el]]});
          else if(yn&&(yn.el==='O'||yn.el==='N'||yn.el==='S')){ var pk2={O:'hydroxy',N:'amino',S:'mercapto'}[yn.el]; items.push({loc:j+1,en:pk2,cn:SUBCN[pk2]}); }
        });
      });
      var brOK=true;
      extra.forEach(function(id){
        var c=0, host=-1;
        (adj[id]||[]).forEach(function(e2){ if(region[e2.id]&&bp[e2.id]){ c++; host=best.indexOf(e2.id); } });
        if(c!==1){ brOK=false; return; }
        var bl=1;
        (function dfs2(p,vis){
          if(p.length>bl) bl=p.length;
          (adj[p[p.length-1]]||[]).forEach(function(e2){
            if(extra.indexOf(e2.id)<0||vis[e2.id]) return;
            vis[e2.id]=1; p.push(e2.id); dfs2(p,vis); p.pop(); delete vis[e2.id];
          });
        })([id],(function(){var o={};o[id]=1;return o;})());
        var ben=ALKE[bl]||('alk'+bl);
        items.push({loc:host+1,en:ben,cn:SUBCN[ben]||ROOT1[bl]+'基'});
      });
      var cn;
      var baseEn=ALKE[best.length]||'hexyl';
      if(!brOK||!items.length){ cn=ROOT1[best.length]+'基'; }
      else{
        items.sort(function(a,b){return a.en<b.en?-1:(a.en>b.en?1:0);});
        var seen={}, parts2=[];
        items.forEach(function(it){
          if(seen[it.en]) return; seen[it.en]=1;
          var same=items.filter(function(x){return x.en===it.en;}).map(function(x){return x.loc;}).sort(function(a,b){return a-b;});
          parts2.push(same.join(',')+'-'+(same.length>1?CNT[same.length]:'')+it.cn);
        });
        cn=parts2.join('-')+ROOT1[best.length]+'基';
      }
      subs.push({ri:i,cn:cn,key:(items.length?items[0].en+'.':'')+baseEn,kind:'gen'});
    }
  }
  if(!subs.length) return '苯';
  var bestNum=null;
  for(var s=0;s<6;s++){
    for(var d=-1;d<=1;d+=2){
      var pl=subs.map(function(sb){
        var p=((sb.ri-s)*d)%6; if(p<0)p+=6; return {loc:p+1,sb:sb};
      });
      var locs=pl.map(function(x){return x.loc;}).sort(function(a,b){return a-b;});
      var fk=pl.slice().sort(function(a,b){return a.sb.key<b.sb.key?-1:(a.sb.key>b.sb.key?1:0);})[0];
      var firstLoc=fk?fk.loc:0;
      if(!bestNum||cmpKey(locs,bestNum.locs)<0||(cmpKey(locs,bestNum.locs)===0&&firstLoc<bestNum.firstLoc))
        bestNum={s:s,d:d,locs:locs,firstLoc:firstLoc};
    }
  }
  var placed=subs.map(function(sb){
    var p=((sb.ri-bestNum.s)*bestNum.d)%6; if(p<0)p+=6;
    return {loc:p+1,sb:sb};
  });
  placed.sort(function(a,b){return a.sb.key<b.sb.key?-1:(a.sb.key>b.sb.key?1:0);});
  var allMethyl=placed.every(function(p){return p.sb.kind==='alk1';});
  var locStr=placed.map(function(p){return p.loc;}).sort(function(a,b){return a-b;}).join(',');
  if(placed.length===1){
    var p0=placed[0];
    if(p0.sb.kind==='pre') return {amino:'苯胺',hydroxy:'苯酚',mercapto:'苯硫酚'}[p0.sb.key]||p0.sb.cn+'苯';
    if(p0.sb.kind==='hal') return p0.sb.cn+'苯';
    if(p0.sb.kind==='alk1') return '甲苯';
    if(p0.sb.kind==='iso') return '异丙苯';
    if(p0.sb.cn==='乙基') return '乙苯';
    return p0.sb.cn+'苯';
  }
  if(placed.length===2&&allMethyl){
    var pair=placed.map(function(p){return p.loc;}).sort(function(a,b){return a-b;});
    if(pair[0]===1&&pair[1]===2) return '邻二甲苯';
    if(pair[0]===1&&pair[1]===3) return '间二甲苯';
    if(pair[0]===1&&pair[1]===4) return '对二甲苯';
    return locStr+'-二甲苯';
  }
  if(allMethyl&&placed.length>=3) return locStr+'-'+CNT[placed.length]+'甲苯';
  var groups={};
  placed.forEach(function(p){ (groups[p.sb.key]=groups[p.sb.key]||{sb:p.sb,locs:[]}).locs.push(p.loc); });
  var gks=Object.keys(groups).sort(function(a,b){return a<b?-1:1;});
  var parts=gks.map(function(k){
    var ls=groups[k].locs.sort(function(a,b){return a-b;});
    var cn=groups[k].sb.cn;
    if(ls.length>1){
      if(cn.indexOf('-')>=0||cn.indexOf(',')>=0) return ls.join(',')+'-'+CNT[ls.length]+'('+cn+')';
      return ls.join(',')+'-'+CNT[ls.length]+cn;
    }
    return ls.join(',')+'-'+cn;
  });
  return parts.join('-')+'苯';
}

/* ---------- 自动布局: BFS 扇形展开, 保留旧坐标防跳变 ---------- */
NL.layoutGraph = function(g,prev){
  prev=prev||{};
  var pos={};
  var adj=buildAdj(g), L=96;

  /* ---------- 环枚举：所有简单环(3~10) → 诱导面 + 新边贡献贪心 ---------- */
  var allCycles=[];
  (function(){
    var seenC={};
    g.nodes.forEach(function(st){
      (function dfs(cur,parent,path,vis){
        if(path.length>10) return;
        var es=adj[cur]||[];
        for(var i=0;i<es.length;i++){
          var nid=es[i].id;
          if(nid===parent) continue;
          if(vis[nid]){
            if(nid===st.id&&path.length>=3){
              var key=path.slice().sort().join('|');
              if(!seenC[key]){ seenC[key]=1; allCycles.push(path.slice()); }
            }
            continue;
          }
          vis[nid]=1; path.push(nid);
          dfs(nid,cur,path,vis);
          path.pop(); delete vis[nid];
        }
      })(st.id,null,[st.id],(function(){var o={};o[st.id]=1;return o;})());
    });
  })();
  allCycles.sort(function(a,b){ return a.length-b.length; });
  var rings=[], covE={};
  allCycles.forEach(function(c){
    var n=c.length;
    var cset={}; c.forEach(function(id){cset[id]=1;});
    for(var i=0;i<n;i++){
      var es=adj[c[i]]||[];
      for(var j=0;j<es.length;j++){
        var o=es[j].id;
        if(cset[o]&&o!==c[(i+1)%n]&&o!==c[(i-1+n)%n]) return;
      }
    }
    var novel=false;
    for(var i2=0;i2<n;i2++){ var a=c[i2], b=c[(i2+1)%n]; if(!covE[a+'|'+b]&&!covE[b+'|'+a]){ novel=true; break; } }
    if(!novel&&rings.length) return;
    rings.push(c);
    for(var i3=0;i3<n;i3++){ var a3=c[i3], b3=c[(i3+1)%n]; covE[a3+'|'+b3]=1; covE[b3+'|'+a3]=1; }
  });

  /* ---------- 模板工具 ---------- */
  function tplAngle(n,j){ return -Math.PI/2+j*2*Math.PI/n; }
  function tplR(n){ return L/(2*Math.sin(Math.PI/n)); }

  /* 以公共键(或公共顶点对)为基准放置正多边形：exact=true 时精确重合 */
  function placeOnPair(cids, aid, bid, side){
    var n=cids.length, R=tplR(n);
    var A=pos[aid], B=pos[bid];
    var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    var dx=B.x-A.x, dy=B.y-A.y;
    var dl=Math.sqrt(dx*dx+dy*dy)||1;
    var px=-dy/dl, py=dx/dl;
    /* 模板中两点间步数 k：使弦长最接近 dl */
    var k=1;
    if(n>3){
      var best=1e9;
      for(var kk=1;kk<n;kk++){ var ch=2*R*Math.sin(Math.PI*kk/n); if(Math.abs(ch-dl)<best){ best=Math.abs(ch-dl); k=kk; } }
    }
    var hh=Math.sqrt(Math.max(R*R-(dl/2)*(dl/2),0));
    var C={x:mx+px*hh*side, y:my+py*hh*side};
    var j0=cids.indexOf(aid), j1=cids.indexOf(bid);
    var thA=Math.atan2(A.y-C.y, A.x-C.x);
    var thB=Math.atan2(B.y-C.y, B.x-C.x);
    var nrm=function(x){ while(x>Math.PI)x-=2*Math.PI; while(x<-Math.PI)x+=2*Math.PI; return x; };
    var r1=nrm(tplAngle(n,j1)-tplAngle(n,j0));
    var t1=nrm(thB-thA);
    var mir=(r1*t1>=0)?1:-1;
    for(var q=0;q<n;q++){
      var rel=nrm(tplAngle(n,q)-tplAngle(n,j0));
      var ang=thA+mir*rel;
      pos[cids[q]]={x:C.x+R*Math.cos(ang), y:C.y+R*Math.sin(ang)};
    }
  }
  function placeSpiro(cids, pinId, outward){
    var n=cids.length, R=tplR(n);
    var P=pos[pinId];
    var j0=cids.indexOf(pinId);
    var bestC=null;
    for(var chir=0;chir<2;chir++){
      var dir=chir?-1:1;
      var base=tplAngle(n,j0);
      var rot=Math.atan2(outward.y,outward.x)-base+Math.PI; /* 质心在 -dir0 侧 */
      var cx=P.x-Math.cos(base+rot)*R, cy=P.y-Math.sin(base+rot)*R;
      var ox=cx-P.x, oy=cy-P.y;
      var ol=Math.sqrt(ox*ox+oy*oy)||1;
      var dot=(ox/ol)*outward.x+(oy/ol)*outward.y;
      if(!bestC||dot>bestC.dot) bestC={dot:dot,rot:rot};
    }
    var rot=bestC.rot;
    var cx=P.x-Math.cos(tplAngle(n,j0)+rot)*R, cy=P.y-Math.sin(tplAngle(n,j0)+rot)*R;
    for(var q=0;q<n;q++){
      var ang=tplAngle(n,q)+rot;
      pos[cids[q]]={x:cx+R*Math.cos(ang), y:cy+R*Math.sin(ang)};
    }
  }

  /* ---------- 环系分组（共享原子并查） ---------- */
  var rparent=rings.map(function(_,i){return i;});
  function rfind(x){ while(rparent[x]!==x){ rparent[x]=rparent[rparent[x]]; x=rparent[x]; } return x; }
  for(var i=0;i<rings.length;i++) for(var j=i+1;j<rings.length;j++){
    var share=rings[i].some(function(id){ return rings[j].indexOf(id)>=0; });
    if(share) rparent[rfind(j)]=rfind(i);
  }
  var systems={};
  rings.forEach(function(rc,idx){ var r=rfind(idx); (systems[r]=systems[r]||[]).push(rc); });

  /* ---------- 逐环系刚性放置 ---------- */
  var sysOffset=0, sysRight=null;
  var sysOf={};
  Object.keys(systems).forEach(function(key){
    var sys=systems[key];
    if(sysRight!==null){
      /* 到已放置原子的最短路径边数 → 链隙 = 边数 × L，保证桥键全长 96 */
      var dist={}, q=[], head=0, best=-1;
      sys.forEach(function(rc){ rc.forEach(function(id){ if(dist[id]==null){ dist[id]=0; q.push(id); } }); });
      while(head<q.length){
        var x=q[head++];
        if(dist[x]>0&&pos[x]){ best=dist[x]; break; }
        (adj[x]||[]).forEach(function(e){ if(dist[e.id]==null){ dist[e.id]=dist[x]+1; q.push(e.id); } });
      }
      if(best<1) best=1;
      var n0=sys[0].length;
      sysOffset=sysRight+best*L+(L/(2*Math.sin(Math.PI/n0)));
    }
    var placed=[];
    sys.forEach(function(rc){
      if(!placed.length){
        /* 首环：原点模板 */
        var n=rc.length, R=tplR(n);
        rc.forEach(function(id,q){
          var ang=tplAngle(n,q);
          pos[id]={x:sysOffset+R*Math.cos(ang), y:R*Math.sin(ang)};
        });
        placed.push(rc);
        return;
      }
      /* 找已放置环中共享最多的 */
      var host=null, hostShared=[];
      placed.forEach(function(pc){
        var sh=rc.filter(function(id){ return pc.indexOf(id)>=0; });
        if(!host||sh.length>hostShared.length){ host=pc; hostShared=sh; }
      });
      if(hostShared.length>=2){
        /* 公共键：取在 rc 中相邻的一对 */
        var pair=null;
        for(var q=0;q<rc.length;q++){
          var a=rc[q], b=rc[(q+1)%rc.length];
          if(hostShared.indexOf(a)>=0&&hostShared.indexOf(b)>=0){ pair=[a,b]; break; }
        }
        if(pair){
          /* host 环质心侧 */
          var Mx=(pos[pair[0]].x+pos[pair[1]].x)/2, My=(pos[pair[0]].y+pos[pair[1]].y)/2;
          var hx=0,hy=0,hn=0;
          host.forEach(function(id){ hx+=pos[id].x; hy+=pos[id].y; hn++; });
          hx/=hn; hy/=hn;
          var ux=pos[pair[1]].x-pos[pair[0]].x, uy=pos[pair[1]].y-pos[pair[0]].y;
          var s1=(((hx-Mx)*(-uy)+(hy-My)*ux))>=0?1:-1;
          /* 新环放对侧；若 host 环因公共键被移动需归位——模板边长恒为 L，天然精确 */
          placeOnPair(rc, pair[0], pair[1], -s1);
        }else{
          placeOnPair(rc, hostShared[0], hostShared[1], -1);
        }
      }else if(hostShared.length===1){
        var pin=hostShared[0];
        var hx2=0,hy2=0,hn2=0;
        host.forEach(function(id){ hx2+=pos[id].x; hy2+=pos[id].y; hn2++; });
        hx2/=hn2; hy2/=hn2;
        var ox=pos[pin].x-hx2, oy=pos[pin].y-hy2;
        var ol=Math.sqrt(ox*ox+oy*oy)||1;
        placeSpiro(rc, pin, {x:ox/ol, y:oy/ol});
      }else{
        /* 无共享（不该发生）：放远处 */
        var n2=rc.length, R2=tplR(n2);
        rc.forEach(function(id,q){ var ang=tplAngle(n2,q); pos[id]={x:sysOffset+300+R2*Math.cos(ang), y:R2*Math.sin(ang)}; });
      }
      placed.push(rc);
    });
    sys.forEach(function(rc){ rc.forEach(function(id){ sysOf[id]=key; }); });
    var mnx=1e9,mxx=-1e9;
    sys.forEach(function(rc){ rc.forEach(function(id){ if(pos[id]){ mnx=Math.min(mnx,pos[id].x); mxx=Math.max(mxx,pos[id].x); } }); });
    sysRight=mxx;
  });

  /* ---------- 链与支链：BFS 最大空隙 ---------- */
  if(!Object.keys(pos).length&&g.nodes.length){ pos[g.nodes[0].id]={x:0,y:0}; }
  var queue=Object.keys(pos).slice(), head=0, inq={}, depth={};
  queue.forEach(function(q){ inq[q]=1; depth[q]=0; });
  while(head<queue.length){
    var cur=queue[head++];
    var kids=[];
    (adj[cur]||[]).forEach(function(e){ if(!pos[e.id]&&!inq[e.id]){ kids.push(e.id); inq[e.id]=1; depth[e.id]=depth[cur]+1; } });
    if(!kids.length) continue;
    var nbs=[];
    (adj[cur]||[]).forEach(function(e){ if(pos[e.id]&&e.id!==cur) nbs.push(e.id); });
    var from,gap,off,angs=null;
    if(!nbs.length){
      /* 种子：两个孩子=链的两端(反向伸直)，三个=120°扇形 */
      if(kids.length===2) angs=[0, Math.PI];
      else if(kids.length===3) angs=[0, 2*Math.PI/3, -2*Math.PI/3];
      else { from=0; gap=Math.PI/3; off=0; }
    }
    else if(kids.length===1 && (adj[cur]||[]).length<=2){
      /* 末端延长：沿最深邻居方向直线外推；直前方拥挤则退到最大空隙 */
      var bestN=nbs[0];
      nbs.forEach(function(nid){ if(depth[nid]>depth[bestN]) bestN=nid; });
      var st=Math.atan2(pos[bestN].y-pos[cur].y, pos[bestN].x-pos[cur].x)+Math.PI;
      var nrmA=function(x){ while(x>Math.PI)x-=2*Math.PI; while(x<-Math.PI)x+=2*Math.PI; return x; };
      var crowd=false;
      g.nodes.forEach(function(n){
        if(pos[n.id]&&n.id!==cur&&nbs.indexOf(n.id)<0){
          var da=Math.abs(nrmA(Math.atan2(pos[n.id].y-pos[cur].y,pos[n.id].x-pos[cur].x)-st));
          if(da<0.7) crowd=true;
        }
      });
      if(!crowd){ from=st; gap=0; off=0; }
      else{
        var nb=nbs.map(function(nid){ return Math.atan2(pos[nid].y-pos[cur].y,pos[nid].x-pos[cur].x); });
        nb.sort(function(a,b){return a-b;});
        var bg=-1,bs=0;
        for(var ai=0;ai<nb.length;ai++){
          var a1=nb[ai], a2=(ai+1<nb.length)?nb[ai+1]:nb[0]+Math.PI*2;
          if(a2-a1>bg){ bg=a2-a1; bs=a1; }
        }
        from=bs; gap=bg/2; off=gap;
      }
    }
    else if(nbs.length===1 && kids.length===1 && (adj[cur]||[]).length>2){
      /* 中间原子新键=支链：垂直于链方向 */
      var base2=Math.atan2(pos[nbs[0]].y-pos[cur].y, pos[nbs[0]].x-pos[cur].x)+Math.PI;
      angs=[base2+Math.PI/2, base2-Math.PI/2];
    }
    else if(nbs.length===1){
      /* 只有一个已定位邻居：第一个孩子笔直前伸，其余 ±120° 分支 */
      var base=Math.atan2(pos[nbs[0]].y-pos[cur].y, pos[nbs[0]].x-pos[cur].x)+Math.PI;
      var offs=[0, 2*Math.PI/3, -2*Math.PI/3];
      angs=kids.map(function(kid,idx){ return base+(offs[idx]||0); });
    }
    else{
      var nb=nbs.map(function(nid){ return Math.atan2(pos[nid].y-pos[cur].y,pos[nid].x-pos[cur].x); });
      nb.sort(function(a,b){return a-b;});
      var bg=-1,bs=0;
      for(var ai=0;ai<nb.length;ai++){
        var a1=nb[ai], a2=(ai+1<nb.length)?nb[ai+1]:nb[0]+Math.PI*2;
        if(a2-a1>bg){ bg=a2-a1; bs=a1; }
      }
      from=bs; gap=bg/(kids.length+1); off=gap;
    }
    kids.forEach(function(kid,idx){
      var ang=angs&&angs[idx]!=null?angs[idx]:(from+off+gap*idx);
      pos[kid]={x:pos[cur].x+L*Math.cos(ang), y:pos[cur].y+L*Math.sin(ang)};
      queue.push(kid);
    });
  }

  /* 孤立碎片：横向排列 */
  var isoX=-400;
  g.nodes.forEach(function(n){
    if(!pos[n.id]){ pos[n.id]={x:isoX,y:260}; isoX+=140; }
  });

  /* 链原子防挤压：环保刚，链原子互推/被环推（防止链自叠成"假连接"） */
  var ringA={};
  rings.forEach(function(rc){ rc.forEach(function(id){ ringA[id]=1; }); });
  var ids3=Object.keys(pos);
  for(var it2=0;it2<90;it2++){
    var mv2=false;
    for(var i=0;i<ids3.length;i++){
      for(var j=i+1;j<ids3.length;j++){
        var A=pos[ids3[i]], B=pos[ids3[j]];
        var fi=ringA[ids3[i]]?1:0, fj=ringA[ids3[j]]?1:0;
        if(fi&&fj) continue;
        var dx=B.x-A.x, dy=B.y-A.y;
        var d=Math.sqrt(dx*dx+dy*dy)||0.01;
        if(d<50){
          var push=(50-d)*0.5;
          var ux=dx/d, uy=dy/d;
          if(fi){ B.x+=ux*push; B.y+=uy*push; }
          else if(fj){ A.x-=ux*push; A.y-=uy*push; }
          else{ A.x-=ux*push*0.5; A.y-=uy*push*0.5; B.x+=ux*push*0.5; B.y+=uy*push*0.5; }
          mv2=true;
        }
      }
    }
    if(!mv2) break;
  }

  /* 长键修复：断开该键后含环原子的一侧整体刚性平移，把 >1.5L 的键收回 L */
  var ringAtom={};
  rings.forEach(function(rc){ rc.forEach(function(id){ ringAtom[id]=1; }); });
  for(var rp=0;rp<8;rp++){
    var any=false;
    g.edges.forEach(function(e){
      var a=pos[e.a], b=pos[e.b];
      if(!a||!b) return;
      var dx=b.x-a.x, dy=b.y-a.y;
      var d=Math.hypot(dx,dy)||1;
      if(d>1.5*L){
        var seen={}, q=[e.b], hasRing=false, comp=[];
        seen[e.b]=1;
        while(q.length){
          var x=q.pop(); comp.push(x);
          if(ringAtom[x]) hasRing=true;
          (adj[x]||[]).forEach(function(ed){
            var y=ed.id;
            if(y!==e.a&&!seen[y]&&pos[y]){ seen[y]=1; q.push(y); }
          });
        }
        if(hasRing&&comp.length<60){
          var ux=dx/d, uy=dy/d, shift=d-L;
          comp.forEach(function(id){ pos[id]={x:pos[id].x-ux*shift, y:pos[id].y-uy*shift}; });
        }
        any=true;
      }
    });
    if(!any) break;
  }

  /* 质心居中 */
  var ids2=Object.keys(pos);
  if(ids2.length){
    var cx=0,cy=0;
    ids2.forEach(function(k){ cx+=pos[k].x; cy+=pos[k].y; });
    cx/=ids2.length; cy/=ids2.length;
    ids2.forEach(function(k){ pos[k]={x:pos[k].x-cx, y:pos[k].y-cy}; });
  }
  return pos;
};
})();
</script>

    var t0={x:p2.x-ux*(rad[e.b]+1),y:p2.y-uy*(rad[e.b]+1)};
    var seg=function(off,w,key){
      return h('line',{key:key,className:isNew?'bond-new':'',
        x1:s0.x+ox*off,y1:s0.y+oy*off,x2:t0.x+ox*off,y2:t0.y+oy*off,
        stroke:'var(--node)','stroke-width':w,'stroke-linecap':'round'});
    };
    if(e.order===2) return h('g',{key:i},seg(-3.2,4,i+'a'),seg(3.2,4,i+'b'));
    if(e.order===3) return h('g',{key:i},seg(-4.8,3.4,i+'a'),seg(0,3.4,i+'b'),seg(4.8,3.4,i+'c'));
    return seg(0,5,i);
  });
  var nodes=graph.nodes.map(function(n){
    var p=pos[n.id]; if(!p) return null;
    var isSel=sel.indexOf(n.id)>=0;
    var ncls='vnode'+(fresh.nodes[n.id]?' node-pop':'');
    var st=ELC[n.el]||ELC.C;
    var R=(n.el==='H'?11:16)*(rs||1);
    var two=n.el.length>1;
    return h('g',{key:n.id,'data-nid':n.id,className:ncls,style:{cursor:onNodeClick?'pointer':'default'}},
      h('circle',{cx:p.x,cy:p.y,r:R+3.5,fill:'none',stroke:isSel?'var(--accent)':st[1],'stroke-width':isSel?2.5:1.1,className:'glowring',opacity:isSel?1:.55}),
      h('circle',{cx:p.x,cy:p.y,r:R,fill:'url(#g'+n.el+')',stroke:st[3],'stroke-width':1.5}),
      h('ellipse',{cx:p.x-R*0.31,cy:p.y-R*0.38,rx:R*0.33,ry:R*0.2,fill:'rgba(255,255,255,.5)',style:{pointerEvents:'none'}}),
      h('text',{x:p.x,y:p.y+(two?3.8:4.8),'text-anchor':'middle',fill:st[4],'font-size':(two?10.5:13)*(rs<1?0.92:1),'font-weight':900,style:{pointerEvents:'none'}},n.el),
      (isSel&&props.rippleSel)?h('g',{key:'rp',style:{pointerEvents:'none'}},
        [0,1,2].map(function(rk){
          return h('circle',{key:rk,cx:p.x,cy:p.y,r:R+2,className:'ripple r'+rk,fill:'none',stroke:'var(--accent)'});
        })):null);
  });
  return h('div',{className:'molwrap'},
    h('svg',{ref:svgRef,viewBox:'0 0 '+vb.w+' '+vb.h,preserveAspectRatio:'xMidYMid meet',
        onPointerDown:onPointerDown,onPointerLeave:function(){ focRef.current=false; }},
      h('g',{transform:'translate('+((vb.w/2)+view.x)+' '+(350+view.y)+') scale('+view.k+')'},
        h('defs',null,Object.keys(ELC).map(function(el){
          return h('radialGradient',{key:el,id:'g'+el,cx:'35%',cy:'28%',r:'80%'},
            h('stop',{offset:'0%','stop-color':ELC[el][0]}),
            h('stop',{offset:'40%','stop-color':ELC[el][1]}),
            h('stop',{offset:'100%','stop-color':ELC[el][2]}));
        })),
        aromCircs.map(function(ac,aci){ return h('circle',{key:'ac'+aci,cx:ac.cx,cy:ac.cy,r:ac.r,fill:'none',stroke:'var(--node)','stroke-width':2,'stroke-dasharray':'5 5'}); }),
        edges,nodes)),
    h('div',{className:'molhint'},props.hintText||(onNodeClick?'点击原子生长 · 拖拽平移 · 点击后滚轮缩放':'拖拽平移 · 点击后滚轮缩放')));
}
