[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# PubChem 中转代理：/api/pubchem/compound/... → Netlify Function
[[redirects]]
  from = "/api/pubchem/*"
  to = "/.netlify/functions/pubchem/:splat"
  status = 200

# 账号系统
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# SPA 路由回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
